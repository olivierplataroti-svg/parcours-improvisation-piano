cord.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation à C Jam Blues et Blue Monk.","validation":"Deux chorus avec comping strictement identique, six phrases maximum par chorus, aucune attaque de droite dans les mesures de silence prévues et aucune dérive rythmique de la main gauche.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":57},{"kind":"standard","id":"BG4","number":4,"title":"Bag’s Groove · passage 2 — Jouer la grille simplifiée en Fa à la main gauche","objective":"Automatiser le support harmonique avant d’y replacer le riff.","work":"Trois chorus avec fondamentales F, B♭ et C en rondes. Ajouter fondamentale–quinte ou accords-coquilles seulement après stabilité. Employer d’abord une fin V–IV–I simple ; le turnaround enrichi viendra plus tard.","ear":"Dire I, IV et V avant les changements et écouter le retour de C vers F entre les chorus.","tim":"Application des accompagnements intermédiaires à un blues en Fa, sans transposer une walking bass.","validation":"Trois chorus stables et un choix explicite entre accompagnement principal et accompagnement de repli.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":58},{"kind":"standard","id":"BG5","number":5,"title":"Bag’s Groove · passage 2 — Poser le thème sur un accompagnement raréfié","objective":"Conserver le caractère du riff quand la main gauche marque la forme.","work":"Thème avec playback ; puis une fondamentale toutes les deux mesures ; enfin un accord-coquille au temps 1 de chaque mesure. Ne pas changer simultanément le rythme du riff et la figure de gauche.","ear":"Anticiper la première attaque du riff et le changement harmonique suivant.","tim":"Le comping reste fixe ; le thème porte seul l’articulation et le swing.","validation":"Deux thèmes avec la main gauche la plus dense qui ne modifie ni rythme ni silences du riff.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":59},{"kind":"standard","id":"BG6","number":6,"title":"Bag’s Groove · passage 2 — Improviser à une puis deux notes en question–réponse","objective":"Réutiliser la forme du riff pour créer des phrases simples sans réciter la gamme de Fa.","work":"Chorus 1 sur une seule note de Fa ; chorus 2 avec Fa et La♭. Jouer une question de deux mesures, laisser une mesure, puis répondre. Playback d’abord, fondamentales ensuite.","ear":"Entendre la dernière note de la réponse avant de la jouer et vérifier qu’elle termine réellement la phrase.","tim":"Transfert des premières contraintes d’improvisation vers une deuxième tonalité.","validation":"Trois couples question–réponse audibles dans chaque chorus, avec la forme intacte.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":60},{"kind":"week","id":"S65","number":65,"title":"Mélanger pentatoniques majeure et mineure","objective":"Un chorus mineur, un chorus majeur, puis un chorus mixte en signalant chaque changement de couleur.","work":"Playback ou guide tones lents. Pentatonique mineure de Do : Do-Mi bémol-Fa-Sol-Si bémol. Pentatonique majeure de Do : Do-Ré-Mi-Sol-La. Chorus 1 : mineure uniquement ; chorus 2 : majeure uniquement ; chorus 3 : M1-4 mineure, M5-8 majeure, M9-12 choisir l'une des deux avant de commencer et annoncer mentalement le choix. Phrases de 2-4 notes, au moins deux mesures entièrement silencieuses par chorus.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Langage des chapitres 2 et 3, organisé plutôt qu’accumulé.","validation":"Trois chorus sans perte de forme. Dans le chorus 3, les deux changements de couleur prévus doivent être identifiables à la réécoute et correspondre au choix annoncé avant la phrase.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":61},{"kind":"week","id":"S66","number":66,"title":"Anacrouse simple","objective":"Créer une phrase de trois notes commençant sur le « et » de 4 et résolvant sur le temps 1.","work":"Travailler d’abord sur une boucle de deux mesures, puis aux mesures 4-5 et 8-9.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 3 : pick-ups, préparés en micro-cellules.","validation":"Six anacrouses propres sans anticipation de la main gauche.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":62},{"kind":"week","id":"S67","number":67,"title":"Approche chromatique unique","objective":"Approcher une note cible par le demi-ton inférieur : Ré dièse-Mi, Fa dièse-Sol, Si-Do.","work":"Une seule approche chromatique par phrase ; le reste utilise le vocabulaire connu.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation au langage jazz sans lancer le bebop.","validation":"Résoudre huit approches sur une note d’accord, sans s’arrêter sur la tension.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":63},{"kind":"standard","id":"BG7","number":7,"title":"Bag’s Groove · passage 3 — Transformer le riff en motif personnel","objective":"Développer une idée issue du thème au lieu d’ajouter immédiatement davantage de notes.","work":"Extraire une cellule du riff. La jouer, la répéter, modifier seulement sa dernière note, puis laisser un silence. Refaire en changeant seulement le rythme.","ear":"Dire « modèle », « même » ou « variante » après chaque occurrence pour contrôler l’intention.","tim":"Bag’s Groove devient un laboratoire de développement motivique.","validation":"Construire un chorus avec au moins deux séquences motif–répétition–variation–silence.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":64},{"kind":"standard","id":"BG8","number":8,"title":"Bag’s Groove · passage 3 — Viser I, IV et V dans Bag’s Groove","objective":"Faire entendre les changements d’accord à l’intérieur d’un vocabulaire encore réduit.","work":"Playback de Bag's Groove. Cibles disponibles : sur F7, Fa d'abord puis La ; sur Si bémol7, Si bémol puis Ré ; sur Do7, Do puis Mi. Dans chaque chorus, préparer six arrivées sur le temps 1 : M1 Fa, M5 Si bémol, M7 Fa, M9 Do, M10 Si bémol, M11 Fa ; au second chorus, remplacer trois fondamentales par les tierces correspondantes. Une seule approche chromatique inférieure est autorisée dans tout le chorus.","ear":"Entendre chaque cible avant les mesures 1, 5 et 9 ; laisser une note longue après l’arrivée.","tim":"Application des notes cibles et de l’approche chromatique unique à un thème en Fa.","validation":"Sur deux chorus, soit 12 cibles prévues, en atteindre au moins 8 au bon endroit sans perdre la forme. L'approche chromatique reste limitée à une occurrence par chorus et résout immédiatement sur la cible.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":65},{"kind":"standard","id":"BM1","number":1,"title":"Blue Monk · passage 1 — Écouter Blue Monk sans chercher encore toutes les notes","objective":"Créer une représentation globale du thème chromatique avant le travail détaillé.","work":"Écouter une seule version de référence. Repérer thème, solos et retour du thème ; suivre les trois blocs de quatre mesures ; relever seulement les endroits où le contour monte, descend ou se répète.","ear":"Fredonner le contour ou le rythme sans exiger la hauteur exacte. Identifier les fins de phrases plutôt que chanter toute la basse.","tim":"Préparation au morceau du chapitre 3 avant son déchiffrage et sa coordination.","validation":"Suivre trois chorus et décrire de mémoire le contour des trois grandes cellules du thème.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":66},{"kind":"standard","id":"BM2","number":2,"title":"Blue Monk · passage 1 — Fixer le rythme du thème sans les hauteurs","objective":"Empêcher les cellules chromatiques de masquer les silences et le placement swing.","work":"Frapper ou dire le rythme de cellules de deux mesures, écouter le modèle, puis corriger. Ne toucher le clavier qu’après deux reproductions rythmiques exactes.","ear":"Comparer nombre d’attaques, durée des notes et espace entre les cellules.","tim":"La difficulté mélodique est isolée de la difficulté rythmique.","validation":"Reproduire quatre cellules rythmiques deux fois de suite sans ajout ni suppression.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":67},{"kind":"standard","id":"BM3","number":3,"title":"Blue Monk · passage 1 — Apprendre les quatre premières mesures exactement","objective":"Installer un premier fragment chromatique fidèle avant d’autoriser toute réponse personnelle.","work":"Main droite seule, une mesure puis deux puis quatre. Garder un doigté fixe. Jouer modèle et reproduction en alternance ; ne pas corriger en cours de phrase.","ear":"Entendre le mouvement chromatique et la note d’arrivée de chaque cellule.","tim":"Première moitié préparatoire de la semaine S70 consacrée au contour.","validation":"Quatre mesures de mémoire, deux fois, avec rythme et hauteurs identiques à la référence.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":68},{"kind":"week","id":"S68","number":68,"title":"C Jam Blues : le thème comme laboratoire rythmique","objective":"Apprendre le thème à droite avec playback ; varier uniquement le rythme de ses deux notes principales.","work":"Playback seul ou guide tones en rondes, sans autre accompagnement nouveau. Prise 1 : jouer le thème exactement comme la référence. Prises 2 à 4 : garder strictement les deux hauteurs principales du thème et modifier une seule chose rythmique par prise - soit déplacer une attaque, soit allonger une durée, soit ajouter un silence. Ne jamais modifier simultanément hauteur et rythme.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 2 ou version du chapitre 5 selon l’édition : C Jam Blues.","validation":"Un thème original exact puis trois variations rythmiques différentes et reconnaissables. Pour chacune, pouvoir dire avant ou après la prise quelle modification rythmique unique a été utilisée.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":69},{"kind":"week","id":"S69","number":69,"title":"C Jam Blues : improviser avec deux notes","objective":"Construire deux chorus seulement avec les notes du thème, silences compris.","work":"Playback de C Jam Blues. Chorus 1 : uniquement les deux notes du thème, maximum deux attaques par mesure et au moins trois mesures entièrement silencieuses. Chorus 2 : mêmes deux notes, jusqu'à quatre attaques maximum par mesure sur les mesures jouées, avec au moins deux mesures entièrement silencieuses et un motif répété. Chorus 3 : reprendre la densité du chorus 2 et ajouter une seule note d'approche ou une seule blue note résolue dans tout le chorus.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"C Jam Blues devient le premier véritable support de jazz-blues.","validation":"Les trois chorus restent dans la forme et ont une densité clairement progressive : chorus 1 <= 2 attaques par mesure jouée ; chorus 2 <= 4 ; chorus 3 même plafond avec une seule note supplémentaire de tension. Aucun chorus ne doit perdre les silences imposés.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":70},{"kind":"standard","id":"CJ7","number":7,"title":"C Jam Blues · passage 3 — Relier call & response, motif et notes cibles","objective":"Faire entendre une construction musicale avant d’utiliser librement toute la gamme blues.","work":"Chorus 1 : deux notes du thème en question–réponse. Chorus 2 : répéter un motif puis modifier seulement sa fin. Chorus 3 : conserver ce motif et viser Do, Fa puis Sol aux entrées de I, IV et V.","ear":"Annoncer mentalement la note d’arrivée avant les mesures 1, 5 et 9 ; après la prise, repérer le motif réellement répété.","tim":"C Jam Blues réunit les compétences des semaines 55–57 dans une forme déjà mémorisée.","validation":"Les trois chorus ont des fonctions distinctes, restent dans la forme et contiennent au moins trois arrivées prévues.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":71},{"kind":"standard","id":"CJ8","number":8,"title":"C Jam Blues · passage 3 — Interpréter C Jam Blues comme un morceau complet","objective":"Valider la première forme thème–solo–thème sans imposer une main gauche trop dense.","work":"Jouer le thème ; un chorus limité à une ou deux notes ; un chorus utilisant la gamme blues par courtes cellules ; puis le retour du thème. Une approche chromatique résolue est facultative. Playback, guide tones ou comping fixe sont autorisés.","ear":"Entendre le début du thème avant son retour et conserver au moins une mesure de silence dans chaque chorus improvisé.","tim":"C Jam Blues devient le premier standard réellement acquis, et non seulement un morceau rencontré dans le livre.","validation":"Une prise continue thème–deux chorus–thème, sans arrêt, avec motif, silences et reprise exacte du thème.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":72},{"kind":"week","id":"S70","number":70,"title":"Blue Monk : apprendre le contour","objective":"Apprendre quatre mesures à la fois, à droite seule, en chantant les cellules chromatiques.","work":"Playback ou guide tones tenus, main gauche sans basse mobile. Travailler Blue Monk à droite seule par cellules : M1-2, M3-4, puis M1-4 ; ensuite M5-6, M7-8 puis M5-8. Chanter ou dire le contour avant chaque cellule. La maîtrise des mesures 9-12 n'est pas exigée dans cette semaine et sera complétée dans les blocs suivants.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 3 : Blue Monk.","validation":"Jouer de mémoire les mesures 1-8 avec rythme exact deux fois de suite, puis réussir un départ autonome en M1 et en M5. Les mesures 9-12 ne conditionnent pas la validation de S70.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":73},{"kind":"week","id":"S71","number":71,"title":"Blue Monk : thème et réponse personnelle","objective":"Jouer deux mesures du thème puis inventer une réponse de deux mesures avec trois à cinq notes.","work":"Playback d'abord ; si stable, guide tones tenus au temps 1 à la main gauche. Sur les 12 mesures : M1-2 = deux mesures exactes du thème ; M3-4 = réponse personnelle de 3 à 5 notes ; M5-6 = deux nouvelles mesures exactes du thème ; M7-8 = réponse différente ; M9-10 = fragment du thème disponible ; M11-12 = troisième réponse de 3 à 5 notes. Les réponses peuvent employer les notes déjà connues de la gamme blues, mais chacune doit garder de l'espace et ne pas modifier les fragments du thème.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Blue Monk comme modèle de motif, d’espace et de chromatisme.","validation":"Un chorus complet avec trois réponses différentes, trois fragments de thème rythmiquement exacts et aucune perte de forme. Refaire deux fois ; la main gauche n'est ajoutée que si elle ne modifie aucun fragment du thème.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":74},{"kind":"standard","id":"BM4","number":4,"title":"Blue Monk · passage 2 — Compléter la mélodie et sécuriser les départs","objective":"Passer des fragments au thème entier sans dépendre d’une exécution depuis la première mesure.","work":"Compléter les cellules manquantes, assembler douze mesures, puis démarrer séparément aux mesures 1, 5 et 9. Revenir à deux mesures si une transformation involontaire apparaît.","ear":"Entendre la première et la dernière note de chaque bloc de quatre mesures avant de jouer.","tim":"Blue Monk est mémorisé comme standard, pas seulement reconnu comme morceau du livre.","validation":"Deux thèmes de mémoire et trois départs autonomes dans la forme.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":75},{"kind":"standard","id":"BM5","number":5,"title":"Blue Monk · passage 2 — Installer la grille en Si♭ avec un accompagnement de repli","objective":"Préparer la main gauche séparément afin de protéger le thème chromatique.","work":"B♭7, E♭7 et F7 en fondamentales longues ; puis fondamentale–quinte ou accords-coquilles une fois par mesure. Aucune walking et aucun riff de main droite.","ear":"Nommer I, IV et V et écouter la résolution F → B♭ entre deux chorus.","tim":"Version d’accompagnement simplifiée de Blue Monk.","validation":"Trois grilles stables et choix d’un accompagnement principal ainsi que d’un accompagnement de repli.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":76},{"kind":"standard","id":"BM6","number":6,"title":"Blue Monk · passage 2 — Jouer le thème avec une main gauche très espacée","objective":"Conserver le rythme et les chromatismes du thème lorsque la grille devient audible sous les doigts.","work":"Thème avec playback ; puis une fondamentale toutes les deux mesures ; enfin un accord-coquille au temps 1. Si le thème change, retirer immédiatement une attaque à gauche.","ear":"Anticiper la cellule de droite pendant la tenue de l’accord, sans chercher à chanter la ligne grave.","tim":"Une seule difficulté nouvelle : la superposition, jamais la densification simultanée des deux mains.","validation":"Deux thèmes avec l’accompagnement le plus riche qui préserve toutes les cellules exactes.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":77},{"kind":"week","id":"S72","number":72,"title":"Checkpoint : premier jazz-blues","objective":"Format : thème de C Jam Blues, deux chorus improvisés, retour au thème.","work":"Main gauche : guide tones ou comping fixe ; playback autorisé si le phrasé se dégrade.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Synthèse du chapitre 3 sans walking bass libre.","validation":"Prise complète à 60-80 BPM, forme intacte et au moins un motif développé.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":78},{"kind":"standard","id":"BG9","number":9,"title":"Bag’s Groove · passage 3 — Élargir à la gamme blues sans perdre le riff","objective":"Utiliser toute la gamme blues de Fa comme réservoir tout en conservant motif, silences et notes d’arrivée.","work":"Improviser d’abord sur les mesures 1–4 avec la pentatonique ; ajouter la blue note comme passage ; étendre ensuite à 5–8 puis 9–12. Interdire les montées et descentes continues.","ear":"Entendre le début du motif avant chaque bloc de quatre mesures et identifier la résolution de la blue note.","tim":"La gamme complète arrive après le riff, le call & response et les cibles.","validation":"Un chorus complet où la gamme sert deux motifs reconnaissables et contient au moins trois silences.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":79},{"kind":"standard","id":"BG10","number":10,"title":"Bag’s Groove · passage 3 — Interpréter Bag’s Groove de bout en bout","objective":"Valider le transfert du premier standard vers un blues en Fa fondé sur un riff.","work":"Thème ; chorus 1 à deux notes en call & response ; chorus 2 avec motif, cibles et gamme blues ; retour du thème. Utiliser la grille simplifiée, puis seulement lors d’une reprise ultérieure le turnaround authentique.","ear":"Entendre le retour du riff avant le dernier chorus et conserver son articulation originale.","tim":"Deuxième standard complet du mini-répertoire.","validation":"Une prise continue thème–deux chorus–thème, avec motif identifiable et aucune perte de la forme en Fa.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":80},{"kind":"standard","id":"TM1","number":1,"title":"Tenor Madness · passage 1 — Découvrir le blues en Si♭ par l’écoute","objective":"Installer une nouvelle tonalité et un nouveau riff dans l’oreille avant toute coordination.","work":"Écouter une version de référence de Tenor Madness. Suivre les trois blocs de quatre mesures, reconnaître le riff et marquer les mesures 1, 5 et 9. Aucun travail de main gauche.","ear":"Fredonner le rythme du riff et écouter la différence de centre tonal avec C Jam Blues et Bag’s Groove.","tim":"Ouverture contrôlée vers Si♭, tonalité fréquente du jazz-blues.","validation":"Suivre trois chorus, annoncer correctement les repères 1–5–9 et reconnaître chaque retour du thème.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":81},{"kind":"standard","id":"TM2","number":2,"title":"Tenor Madness · passage 1 — Préparer la grille en Si♭ sans mélodie","objective":"Ne pas apprendre simultanément le riff et une nouvelle géographie de main gauche.","work":"Jouer B♭, E♭ et F en rondes, d’abord par blocs de quatre mesures puis sur la grille. Ajouter les quintes seulement après trois grilles stables. Playback coupé ou très bas.","ear":"Dire I, IV et V ; entendre F revenir vers B♭ entre deux chorus.","tim":"Transposition de la charpente harmonique, pas de la basse R-3-5-3.","validation":"Trois grilles en rondes sans hésitation et deux grilles fondamentale–quinte si la première étape est stable.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":82},{"kind":"standard","id":"TM3","number":3,"title":"Tenor Madness · passage 1 — Apprendre le riff à la main droite","objective":"Mémoriser le thème sans laisser la nouvelle tonalité dégrader le swing.","work":"Frapper le rythme, puis apprendre deux mesures à la fois avec playback. Conserver les doigtés et le registre choisis ; la main gauche reste silencieuse.","ear":"Écouter la première attaque, le contour et la durée de la fin avant chaque reproduction.","tim":"Tenor Madness apporte un riff swing accessible mais ne doit pas devenir un exercice de déchiffrage continu.","validation":"Reproduire toutes les cellules de deux mesures deux fois de suite au rythme exact.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":83},{"kind":"week","id":"S73","number":73,"title":"Walking bass écrite sur un accord","objective":"Main gauche seule : quatre noires écrites sur C7, avec fondamentale, tierce, quinte et note d’approche.","work":"Ouvrir la walking bass simple de Tim Richards choisie comme référence pour ce parcours. Sélectionner une seule cellule écrite de C7 contenant quatre noires et la conserver strictement identique toute la semaine ; noter sur la partition la fondamentale, la tierce, la quinte et la note d'approche. Main droite silencieuse. Jouer la cellule huit fois, pause, puis huit fois à 44-56 BPM.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Choisir une walking bass simple de Tim Richards.","validation":"Deux séries de huit mesures identiques, régulières et détendues à 44-56 BPM, sans modifier une seule note de la cellule écrite. Réussir sur deux jours différents.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":84},{"kind":"week","id":"S74","number":74,"title":"Cellules de walking sur I, IV et V","objective":"Apprendre une cellule fixe pour C7, F7 et G7 ; les jouer séparément puis par paires.","work":"À partir de la même walking écrite de Tim Richards, fixer une cellule de quatre noires pour C7, une pour F7 et une pour G7. Les trois cellules choisies doivent rester écrites et identiques pendant tout le bloc. Travailler chaque cellule huit fois, puis les paires C7-F7, F7-C7 et G7-F7 quatre fois chacune. Identifier dans chaque cellule la quatrième noire qui prépare l'accord suivant.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 3 : walking bass, réduite à trois cellules mémorisées.","validation":"Quatre transitions C7-F7, quatre F7-C7 et quatre G7-F7 sans arrêt, avec les cellules exactement conformes au modèle écrit. Les trois cellules doivent être rejouables de mémoire lors de deux séances différentes.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":85},{"kind":"week","id":"S75","number":75,"title":"Walking fixe sur 12 mesures","objective":"Assembler les trois blocs de quatre mesures ; compter les numéros de mesure.","work":"Assembler exclusivement les trois cellules écrites et mémorisées en S73-S74. Main droite silencieuse. Construire d'abord M1-4 cinq fois, puis M5-8 cinq fois, puis M9-12 cinq fois. Ensuite jouer les 12 mesures en comptant mentalement les numéros de mesure. La ligne doit rester strictement identique à chaque chorus.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Une walking écrite du livre, choisie pour sa régularité.","validation":"Deux grilles de 12 mesures consécutives avec la même walking, aucune note remplacée, aucun arrêt et repères 1-5-9 conservés.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":86},{"kind":"week","id":"S76","number":76,"title":"Walking + note tenue","objective":"Main droite : une note tenue toutes les deux mesures, puis une note au premier temps des blocs 1, 5 et 9.","work":"Main gauche : walking fixe de S75, sans aucune variation. Main droite : étape A, Do tenu pendant quatre temps dans les mesures 1, 3, 5, 7, 9 et 11 ; mesures paires silencieuses. Après deux chorus stables, étape B : Do noire uniquement sur le temps 1 des mesures 1, 5 et 9. Aucune autre attaque de droite.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Reprise de la progression des semaines 30-31 avec une basse plus exigeante.","validation":"Deux chorus à l'étape A puis deux à l'étape B sans raccourcir, accentuer ou déplacer une noire de la walking. Les interventions de droite doivent tomber exactement aux mesures prévues.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":87},{"kind":"week","id":"S77","number":77,"title":"Walking + motif préparé","objective":"Main droite : un motif fixe de deux ou trois notes, une fois toutes les deux mesures.","work":"Main gauche : walking fixe de S75. Main droite : motif Do-Mi bémol-Fa au rythme noire-noire-blanche, une fois toutes les deux mesures dans les mesures 1, 3, 5, 7, 9 et 11 ; mesures paires silencieuses à droite. Commencer par M1-4, puis M1-8, puis la grille complète. Si la walking vacille, revenir immédiatement aux guide tones ou supprimer une occurrence du motif plutôt que de modifier la walking.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation à un solo sur walking, sans objectif de liberté totale.","validation":"D'abord deux blocs de quatre mesures réussis trois fois chacun, puis une grille de 12 mesures sans arrêt avec au moins quatre des six motifs prévus et walking inchangée. La semaine n'est validée complètement qu'après une grille entière.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":88},{"kind":"week","id":"S78","number":78,"title":"Bilan demandé : socle blues autonome","objective":"Enregistrer trois versions : playback + solo ; accords-coquilles + solo ; basse R-3-5-3 ou walking fixe + solo limité.","work":"Enregistrer trois versions du même chorus improvisé : A = playback + solo ; B = accords-coquilles au temps 1 + solo ; C = R-3-5-3 ou walking fixe + solo limité. Dans A et B, utiliser 3 à 5 notes, au moins trois mesures entières de silence, un motif répété et une conclusion volontaire. Dans C, réduire à Do-Mi bémol-Fa et une phrase toutes les deux mesures. Faire précéder les trois versions par le même thème de Tim Richards.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Point d’étape des 78 semaines.","validation":"Pour A et B, cinq critères : pulsation, forme, au moins trois mesures silencieuses, motif reconnaissable, conclusion volontaire ; il faut au moins 4/5 dans chacune. C est un test optionnel de densité : il est réussi si la basse reste continue, mais son échec n'empêche pas de valider le socle.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":89},{"kind":"standard","id":"TM4","number":4,"title":"Tenor Madness · passage 2 — Mémoriser le thème et les départs 1–5–9","objective":"Connaître la mélodie indépendamment de son enchaînement depuis la première mesure.","work":"Assembler le thème avec playback, puis commencer séparément aux mesures 1, 5 et 9. Corriger localement toute cellule transformée involontairement.","ear":"Comparer une prise au modèle et nommer une seule différence de rythme ou de hauteur.","tim":"La mémorisation exacte précède la variation volontaire.","validation":"Deux thèmes de mémoire et trois départs autonomes dans la forme.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":90},{"kind":"standard","id":"TM5","number":5,"title":"Tenor Madness · passage 2 — Improviser un chorus à une note en Si♭","objective":"Retrouver la liberté rythmique dans la nouvelle tonalité sans charger la main gauche.","work":"Sur playback, utiliser B♭ uniquement : une phrase de deux mesures maximum et une mesure vide sur quatre. Refaire avec fondamentales en rondes seulement si la forme reste stable.","ear":"Entendre l’attaque et décider si chaque phrase répond au riff ou laisse de l’espace.","tim":"Retour volontaire à la contrainte la plus simple lors d’un changement de tonalité.","validation":"Deux chorus contrastés sur playback et un chorus avec accompagnement minimal.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":91},{"kind":"standard","id":"TM6","number":6,"title":"Tenor Madness · passage 2 — Construire un call & response à deux notes","objective":"Faire du dialogue la structure principale du premier solo sur Tenor Madness.","work":"Utiliser B♭ et D♭. Question courte, silence, réponse qui revient vers B♭. Préparer deux couples, puis les placer librement dans la grille.","ear":"Chanter ou entendre uniquement la note finale de la réponse avant de jouer.","tim":"Le riff du thème sert de modèle de concision et de réponse.","validation":"Un chorus contenant au moins trois couples question–réponse clairement séparés.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":92},{"kind":"week","id":"S79","number":79,"title":"Triades mineures et accords m7","objective":"Former Cm, Fm puis Cm7 et Fm7 ; comparer tierce mineure de l’accord et tierce bleue sur accord majeur.","work":"Main droite d'abord : former Do-Mi bémol-Sol, Fa-La bémol-Do, puis Cm7 = Do-Mi bémol-Sol-Si bémol et Fm7 = Fa-La bémol-Do-Mi bémol. Jouer chaque forme quatre fois puis alterner Cm7-Fm7. Ensuite, sur playback de blues mineur, improviser un chorus avec la pentatonique de Do mineur Do-Mi bémol-Fa-Sol-Si bémol, main gauche silencieuse.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 5 : accords mineurs.","validation":"Instrument : enchaîner Cm7-Fm7 huit fois sans chercher les notes et improviser un chorus sans quitter la pentatonique ni perdre la forme. Oreille : identifier majeur ou mineur sur au moins 7 exemples sur 8. Les deux volets sont nécessaires.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":93},{"kind":"week","id":"S80","number":80,"title":"Grille de blues mineur","objective":"Mémoriser la grille choisie et jouer les fondamentales en rondes.","work":"Main gauche : fondamentales de la grille de blues mineur choisie, une ronde par mesure. Main droite : uniquement Do-Mi bémol-Fa, une phrase de 2 à 4 attaques maximum toutes les deux mesures ; l'autre mesure du bloc reste silencieuse à droite. Après deux chorus stables, Sol peut être ajouté comme quatrième note, mais il n'est pas requis pour valider cette semaine.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 5 : préparation au Minor Blues Workout.","validation":"Deux chorus mains ensemble avec fondamentales tenues quatre temps, trois notes seulement à droite et aucune confusion entre les fonctions mineures de la grille. La forme doit rester intacte sur les deux chorus.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":94},{"kind":"week","id":"S81","number":81,"title":"Blues mineur avec accords-coquilles","objective":"Main gauche : Cm7, Fm7 et G7 en formes réduites tenues.","work":"Main gauche : formes réduites tenues quatre temps, Cm7 = Do-Mi bémol-Si bémol ; Fm7 = Fa-La bémol-Mi bémol ; G7 = Sol-Si-Fa. Main droite : dans chaque bloc de quatre mesures, M1 motif fixe Do-Mi bémol-Fa noire-noire-blanche ; M2 silence ; M3 réponse libre de 2 à 3 notes parmi Do-Mi bémol-Fa-Sol ; M4 silence. Répéter le schéma trois fois sur le chorus.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Minor Blues Workout, version préparatoire.","validation":"Deux chorus avec trois cycles motif-silence-réponse-silence, accords de gauche tenus sans raccourcissement et aucune perte de la couleur mineure ni de la forme.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":95},{"kind":"week","id":"S82","number":82,"title":"Phrasé du blues mineur","objective":"Cibler Mi bémol, Fa et Si bémol ; utiliser davantage d’espace et des notes longues.","work":"Conserver l'accompagnement de S81. Main droite : cibles Mi bémol, Fa et Si bémol ; phrases de 2 à 4 notes maximum. Construire un chorus en trois zones : M1-4 retenu, maximum deux attaques par mesure jouée et au moins une mesure silencieuse ; M5-8 développé, jusqu'à quatre attaques par mesure jouée ; M9-12 retour au calme, maximum deux attaques par mesure et dernière note tenue au moins deux temps.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 5, sans chercher encore les arrangements avancés.","validation":"À la réécoute, les trois zones doivent respecter les plafonds d'attaques prévus, la zone 1 et la zone 3 comporter chacune au moins une mesure silencieuse et la forme rester intacte. Réussir deux prises.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":96},{"kind":"week","id":"S83","number":83,"title":"Accords de neuvième à droite","objective":"Former C9, F9 et G9 en voicings simples ; comparer leur couleur aux accords de septième.","work":"Main droite : voicings simples à quatre notes C9 = Do-Mi-Si bémol-Ré ; F9 = Fa-La-Mi bémol-Sol ; G9 = Sol-Si-Fa-La. Étape A : jouer chaque voicing quatre fois puis trois cycles C9-F9-C9-G9-F9-C9. Étape B : sur playback, main gauche silencieuse, utiliser un seul accord de neuvième comme ponctuation à la fin d'une phrase aux mesures 4, 8 et 12 ; ne pas en faire un accompagnement continu.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 4 : accords de neuvième.","validation":"Trois cycles d'accords sans chercher les notes puis un chorus avec exactement trois ponctuations de neuvième aux mesures 4, 8 et 12, sans perte de pulsation.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":97},{"kind":"week","id":"S84","number":84,"title":"Voicings réduits de neuvième","objective":"Main gauche : 3-b7-9, une forme par accord, en rondes puis sur les temps 1 et 3.","work":"Main gauche : C9 = Mi-Si bémol-Ré, F9 = La-Mi bémol-Sol, G9 = Si-Fa-La. Étape A : une ronde au temps 1 sur toute la grille. Étape B : mêmes voicings aux temps 1 et 3. Main droite : premier chorus, Do noire sur le temps 2 des mesures impaires ; second chorus, motif Do-Mi bémol-Fa noire-noire-blanche dans les mesures 1, 3, 5, 7, 9 et 11. Ne densifier la droite qu'après une grille stable de gauche.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 4, sélection de formes à trois notes.","validation":"Une grille entière de voicings en rondes puis une grille aux temps 1 et 3 sans rupture de voice leading, suivies d'un chorus avec motif de droite sans modification involontaire de la main gauche.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":98},{"kind":"standard","id":"TM7","number":7,"title":"Tenor Madness · passage 3 — Développer un fragment du riff","objective":"Créer un solo cohérent à partir d’un élément déjà mémorisé.","work":"Choisir deux ou trois notes du thème. Répéter le fragment, déplacer son départ rythmique, puis modifier seulement sa fin. Garder une mesure vide après chaque séquence.","ear":"Identifier à l’écoute ce qui reste commun entre modèle et variante.","tim":"Développement motivique dans une troisième tonalité de blues.","validation":"Deux séquences de développement audibles sans augmenter le nombre de notes.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":99},{"kind":"standard","id":"TM8","number":8,"title":"Tenor Madness · passage 3 — Introduire la gamme blues de Si♭ par zones","objective":"Élargir le vocabulaire sans transformer le solo en gamme ascendante ou descendante.","work":"Pentatonique sur 1–4 ; ajouter la blue note sur 5–8 ; forme complète sur 9–12. Construire uniquement des groupes de deux à quatre notes issus du motif.","ear":"Entendre la résolution de la blue note et conserver la note finale prévue.","tim":"Tenor Madness devient le support principal de la gamme blues en Si♭.","validation":"Un chorus complet avec deux motifs reconnaissables, trois silences et aucune gamme récitée.","phaseNumber":7,"phaseTitle":"Élargir l’accompagnement sans rendre les deux mains libres","routeIndex":100},{"kind":"week","id":"S85","number":85,"title":"Du blues simple au jazz-blues","objective":"Comparer deux grilles : blues simple et jazz-blues avec quick IV en mesure 2 et ii-V aux mesures 9-10.","work":"Main droite silencieuse. Main gauche en fondamentales uniquement. Grille A, blues simple en Do : M1 C7, M2 C7, M3 C7, M4 C7 ; M5 F7, M6 F7, M7 C7, M8 C7 ; M9 G7, M10 F7, M11 C7, M12 C7. Grille B, jazz-blues simplifié : M1 C7, M2 F7, M3 C7, M4 C7 ; M5 F7, M6 F7, M7 C7, M8 C7 ; M9 Dm7, M10 G7, M11 C7, M12 C7. Dire la fonction avant M2, M5, M9 et M10. Jouer deux chorus de chaque grille puis les alterner A-B-A-B.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation à la Méthode de piano jazz et aux versions jazz de C Jam Blues.","validation":"Passer quatre fois d'une grille à l'autre sans confondre M2, M9 ou M10, sans arrêt et avec la bonne fondamentale sur le temps 1 de chaque mesure.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":101},{"kind":"week","id":"S86","number":86,"title":"Mini ii-V-I isolé","objective":"En Do, jouer Dm7-G7-C6 avec accords-coquilles et voice leading minimal.","work":"Main droite absente, puis une note cible tenue sur chaque accord.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Pont explicite vers le jazz, sans improvisation sur plusieurs gammes.","validation":"Huit boucles ii-V-I régulières à 48-64 BPM.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":102},{"kind":"week","id":"S87","number":87,"title":"Intégrer ii-V dans les mesures 9-10","objective":"Boucler les mesures 8-12 du jazz-blues ; cibler Fa sur Dm7, Si ou Fa sur G7, Mi sur C.","work":"Boucle de cinq mesures M8-12 du jazz-blues : M8 C7, M9 Dm7, M10 G7, M11 C7, M12 C7. Main gauche : fondamentales en rondes. Main droite, étape A : M9 Fa tenu au moins deux temps ; M10 choisir Si ou Fa tenu au moins deux temps ; M11 Mi tenu au moins deux temps ; silence de droite sur M8 et M12. Étape B : ajouter une seule note voisine avant chacune de ces trois cibles sans changer la main gauche.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"C Jam Blues ou Blue Monk avec grille enrichie.","validation":"Six boucles correctes de M8-12 avec les trois cibles au bon accord, puis une grille complète de 12 mesures sans perte de forme.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":103},{"kind":"standard","id":"BM7","number":7,"title":"Blue Monk · passage 3 — Repérer les notes cibles déjà présentes dans le thème","objective":"Relier la mélodie de Monk aux fonctions I, IV et V avant d’ajouter des notes de solo.","work":"Choisir une note longue ou une arrivée importante dans chaque bloc de quatre mesures. La jouer seule sur la grille, puis l’encadrer de deux notes du thème.","ear":"Entendre la cible avant son accord et comparer sa couleur sur I, IV ou V.","tim":"Blue Monk devient un modèle de conduite mélodique, pas seulement une suite chromatique.","validation":"Nommer et jouer au moins six cibles du thème au bon endroit dans la grille.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":104},{"kind":"standard","id":"BM8","number":8,"title":"Blue Monk · passage 3 — Créer une approche chromatique qui résout","objective":"Distinguer le chromatisme écrit du thème d’un chromatisme volontaire dans le solo.","work":"Choisir trois cibles. Les approcher d’abord par le demi-ton inférieur, une seule fois par bloc de quatre mesures. Jouer tension, résolution, puis silence.","ear":"Entendre la cible avant l’approche ; vérifier que la tension ne devient jamais une note d’arrêt.","tim":"Application contrôlée de la semaine 67 au langage caractéristique de Blue Monk.","validation":"Huit résolutions propres et un chorus contenant au maximum trois approches prévues.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":105},{"kind":"standard","id":"BM9","number":9,"title":"Blue Monk · passage 3 — Paraphraser une cellule de Blue Monk","objective":"Transformer le matériau du thème sans perdre son identité rythmique.","work":"Jouer une cellule de deux mesures comme écrite ; la répéter ; modifier uniquement sa dernière note ou sa dernière durée ; répondre par une phrase de trois à cinq notes.","ear":"Identifier ce qui reste reconnaissable entre thème, paraphrase et réponse.","tim":"Passage progressif du thème à l’improvisation personnelle.","validation":"Quatre paires thème–paraphrase suivies d’une réponse courte, sans perte de forme.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":106},{"kind":"week","id":"S88","number":88,"title":"Ligne de guide tones","objective":"Construire une ligne lente reliant tierces et septièmes, une ou deux notes par mesure.","work":"Playback ou fondamentales en rondes à la main gauche. Main droite : apprendre d'abord une ligne écrite d'une note par mesure sur le jazz-blues : M1 Mi, M2 Mi bémol, M3 Mi, M4 Mi, M5 Mi bémol, M6 Mi bémol, M7 Mi, M8 Mi, M9 Fa, M10 Fa, M11 Mi, M12 Mi. Tenir chaque note quatre temps. Après deux grilles de mémoire, modifier une seule note en choisissant une autre tierce ou septième de l'accord correspondant, sans changer le rythme.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Compétence centrale du jazz, absente des premières marches du plan joint.","validation":"Jouer la ligne de 12 mesures de mémoire deux fois sans erreur, puis une troisième fois avec exactement une modification volontaire qui conserve une note-guide de l'accord et la continuité de la forme.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":107},{"kind":"week","id":"S89","number":89,"title":"Improviser autour des notes cibles","objective":"Pour chaque accord, choisir une cible et l’approcher avec une note de la pentatonique ou un chromatisme.","work":"Utiliser la grille jazz-blues de S85. Main gauche : fondamentales en rondes ou playback. Préparer une cible sur chaque mesure : C7 = Mi ou Si bémol ; F7 = La ou Mi bémol ; Dm7 = Fa ou Do ; G7 = Si ou Fa. Main droite : arriver sur la cible au temps 1 ou 3, précédée d'au maximum une note de la pentatonique ou d'un demi-ton inférieur. Limiter chaque phrase à une cible principale et 2-4 notes au total.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Application au jazz-blues.","validation":"Dans un chorus de 12 mesures, atteindre au moins 8 cibles prévues au bon accord, sans perdre la forme et sans utiliser plus d'une note d'approche avant chaque cible.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":108},{"kind":"standard","id":"TM9","number":9,"title":"Tenor Madness · passage 3 — Relier gamme blues et notes cibles","objective":"Faire entendre B♭7, E♭7 et F7 à l’intérieur du vocabulaire blues.","work":"Playback de Tenor Madness. Cibles possibles : B♭7 = Si bémol, Ré ou La bémol ; E♭7 = Mi bémol, Sol ou Ré bémol ; F7 = Fa, La ou Mi bémol. Chorus 1 : fondamentales comme cibles aux mesures 1, 5, 7, 9, 10 et 11. Chorus 2 : remplacer trois fondamentales par une tierce ou une septième choisie avant de jouer. Une seule approche chromatique est autorisée dans chaque bloc de quatre mesures.","ear":"Entendre la cible avant la phrase et laisser sa résolution durer au moins un temps.","tim":"Application des guide tones et des approches au troisième standard.","validation":"Sur deux chorus, atteindre au moins 8 cibles prévues au bon accord, maintenir le motif et le swing et ne jamais dépasser trois approches chromatiques par chorus.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":109},{"kind":"standard","id":"TM10","number":10,"title":"Tenor Madness · passage 3 — Interpréter Tenor Madness comme troisième standard","objective":"Valider la tonalité de Si♭ dans une performance structurée et musicalement respirée.","work":"Thème ; chorus 1 à deux notes en call & response ; chorus 2 avec motif, gamme blues et cibles ; retour du thème. Playback ou accords-coquilles, sans walking imposée.","ear":"Anticiper le retour du riff et conserver son placement exact après les solos.","tim":"Troisième standard complet et première performance aboutie en Si♭.","validation":"Une prise continue thème–deux chorus–thème, avec forme, motif, silences et thème final exacts.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":110},{"kind":"standard","id":"BM10","number":10,"title":"Blue Monk · passage 3 — Interpréter Blue Monk comme quatrième standard","objective":"Réunir mélodie exacte, motif, notes cibles et chromatisme sans imposer une basse mobile.","work":"Thème ; chorus 1 fondé sur une cellule du thème ; chorus 2 avec gamme blues, cibles et trois approches chromatiques maximum ; retour du thème. Playback, fondamentales ou accords-coquilles.","ear":"Entendre le premier fragment du thème avant son retour et préserver son articulation après les solos.","tim":"Blue Monk devient une pièce de répertoire complète.","validation":"Une prise continue thème–deux chorus–thème, avec thème final exact et chromatisme toujours résolu.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":111},{"kind":"standard","id":"NT1","number":1,"title":"Now’s the Time · passage 1 — Écouter le phrasé de Now’s the Time","objective":"Entrer dans le langage de Charlie Parker par une mélodie accessible avant d’aborder des lignes bebop rapides.","work":"Écouter une seule version de référence. Suivre les douze mesures en Fa, distinguer thème et solos, puis noter oralement où les phrases commencent avant ou après le temps.","ear":"Fredonner uniquement le rythme et les notes finales ; repérer les espaces qui donnent du relief au thème.","tim":"Premier standard lié au bebop, mais conservé sur une forme de blues déjà connue.","validation":"Suivre trois chorus, reconnaître le retour du thème et reproduire le rythme de trois cellules.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":112},{"kind":"standard","id":"NT2","number":2,"title":"Now’s the Time · passage 1 — Frapper puis jouer le rythme du thème","objective":"Isoler l’articulation swing avant de chercher toute la mélodie.","work":"Découper le thème en cellules de deux mesures. Frapper, écouter, corriger, puis jouer sur une seule note. Ajouter les hauteurs seulement après deux rythmes exacts.","ear":"Comparer placement, accents et longueur des silences, pas seulement le nombre de notes.","tim":"La complexité stylistique est séparée du déchiffrage mélodique.","validation":"Quatre cellules rythmiques exactes, chacune répétée deux fois.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":113},{"kind":"standard","id":"NT3","number":3,"title":"Now’s the Time · passage 1 — Apprendre les quatre premières mesures","objective":"Installer un premier fragment de vocabulaire bebop dans une taille mémorisable.","work":"Main droite seule avec playback très lent. Travailler une mesure, deux puis quatre, garder un doigté fixe et enregistrer la dernière répétition.","ear":"Entendre la note de départ et la note d’arrivée de chaque cellule avant de jouer.","tim":"La mélodie constitue une micro-transcription structurée.","validation":"Quatre mesures de mémoire, deux fois, avec rythme et articulation stables.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":114},{"kind":"week","id":"S90","number":90,"title":"Première micro-transcription","objective":"Choisir une phrase de deux temps à une mesure dans un enregistrement lent ; la chanter, la retrouver et la mémoriser.","work":"Choisir une phrase de deux temps à une mesure dans un enregistrement lent. Étapes obligatoires : 1) écouter trois fois sans piano ; 2) vocaliser le rythme et la dernière note ; 3) retrouver la phrase au clavier ; 4) la rejouer de mémoire trois fois sans l'enregistrement ; 5) la transposer de Do à Fa et la rejouer deux fois ; 6) l'insérer une seule fois dans un chorus, à un emplacement choisi avant la prise.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Tim Richards recommande la transcription en fin de chapitre 3 ; elle est ici réduite à une taille réaliste.","validation":"Rejouer la phrase de mémoire trois fois en Do, deux fois en Fa, puis l'insérer une fois dans un chorus sans perdre la forme. Terminer en produisant une variation rythmique qui garde les mêmes hauteurs.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":115},{"kind":"standard","id":"NT4","number":4,"title":"Now’s the Time · passage 2 — Compléter le thème par cellules","objective":"Mémoriser les douze mesures sans transformer spontanément le rythme ou supprimer des notes.","work":"Ajouter les cellules suivantes, assembler les blocs 1–4, 5–8 et 9–12, puis commencer séparément à 1, 5 et 9.","ear":"Alterner modèle et reproduction ; nommer une seule différence après chaque prise.","tim":"La méthode de micro-transcription de S90 est appliquée à un thème entier.","validation":"Deux thèmes de mémoire et trois départs autonomes dans la forme.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":116},{"kind":"standard","id":"NT5","number":5,"title":"Now’s the Time · passage 2 — Comparer grille simple et turnaround jazz en Fa","objective":"Conserver le repère du blues tout en ajoutant une seule variation harmonique.","work":"Main gauche seule : grille I–IV–V simplifiée, puis mesures 8–12 avec le turnaround utilisé. Jouer seulement fondamentales ou accords-coquilles ; dire les fonctions à voix haute.","ear":"Écouter la direction vers l’accord suivant et particulièrement le retour vers F.","tim":"Application des semaines 85–87 à Now’s the Time.","validation":"Six boucles des mesures 8–12 puis deux grilles complètes sans mélanger les deux versions.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":117},{"kind":"standard","id":"NT6","number":6,"title":"Now’s the Time · passage 2 — Réunir le thème et un comping minimal","objective":"Préserver le phrasé de Parker lorsque la grille est jouée par la main gauche.","work":"Thème avec playback ; puis fondamentales toutes les deux mesures ; puis accords-coquilles au temps 1. Le turnaround reste main gauche seule tant que le thème y devient fragile.","ear":"Anticiper le début de la cellule droite et la prochaine fonction harmonique.","tim":"Le comping reste écrit et fixe pour que le thème garde son articulation.","validation":"Deux thèmes avec l’accompagnement le plus riche qui ne modifie ni rythme ni silences.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":118},{"kind":"week","id":"S91","number":91,"title":"Solo en trois chorus","objective":"Chorus 1 : espace et motif ; chorus 2 : variation et registre plus large ; chorus 3 : densité puis conclusion.","work":"Garder le même accompagnement sur les trois chorus. Chorus 1 : choisir un motif de 2-3 notes, le répéter au moins trois fois et laisser au moins quatre mesures entières de silence. Chorus 2 : conserver ce motif, produire trois variations d'une seule variable et placer au moins une phrase dans un registre plus aigu que le chorus 1 ; garder au moins trois mesures silencieuses. Chorus 3 : M1-8, jusqu'à quatre attaques maximum par mesure jouée ; M9-12, réduire à deux attaques maximum par mesure, laisser de l'espace et conclure volontairement sur une note cible.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Synthèse des principes de phrasé du blues et du jazz.","validation":"Une prise continue de trois chorus où les contraintes de densité et de silence sont respectées, le motif du chorus 1 reste identifiable dans le chorus 2 et le chorus 3 se termine par une réduction de densité et une conclusion prévue.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":119},{"kind":"standard","id":"NT7","number":7,"title":"Now’s the Time · passage 3 — Revenir à une note pour construire le rythme","objective":"Prouver que le caractère du solo vient du phrasé et non du nombre de notes.","work":"Sur playback, improviser un chorus avec F uniquement en reprenant deux rythmes du thème. Laisser une mesure vide sur quatre.","ear":"Entendre le rythme avant l’attaque et reconnaître les deux cellules empruntées au thème.","tim":"Retour à la contrainte de départ dans un contexte stylistique plus avancé.","validation":"Deux chorus distincts dont le placement swing reste stable et reconnaissable.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":120},{"kind":"standard","id":"NT8","number":8,"title":"Now’s the Time · passage 3 — Call & response avec deux puis trois notes","objective":"Conserver le dialogue et l’espace avant d’introduire toute la gamme blues.","work":"Chorus 1 avec F et A♭ ; chorus 2 en ajoutant B♭. Question de deux mesures, réponse courte, puis silence. Playback ou fondamentales en rondes.","ear":"Entendre la note finale de la réponse et vérifier qu’elle conclut vraiment la cellule.","tim":"Les contraintes élémentaires sont réinvesties dans le cinquième standard.","validation":"Trois couples question–réponse par chorus, forme et placement intacts.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":121},{"kind":"standard","id":"NT9","number":9,"title":"Now’s the Time · passage 3 — Développer un motif issu du thème","objective":"Faire entrer un fragment de vocabulaire bebop dans le solo sans réciter une phrase longue.","work":"Choisir deux à quatre notes du thème. Répéter le fragment, déplacer son début, modifier sa fin, puis laisser un silence. Une seule transformation à la fois.","ear":"Identifier le noyau commun entre le thème et les trois variantes.","tim":"La mélodie devient une source de vocabulaire personnel.","validation":"Un chorus contenant deux développements motiviques clairement reconnaissables.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":122},{"kind":"week","id":"S92","number":92,"title":"Comping et solo : choisir son rôle","objective":"Alterner un chorus où la main gauche accompagne et un chorus joué seulement sur playback.","work":"Préparer à la main droite le même chorus limité à Do-Mi bémol-Fa, avec un motif fixe présent au moins trois fois et au moins trois mesures entières de silence. Version A : jouer ce chorus sur playback, main gauche silencieuse. Version B : rejouer le même contenu avec accords-coquilles au temps 1, sans modifier volontairement les phrases de droite. Ne jamais improviser la basse.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Principe d’autonomie plus important que la walking libre.","validation":"Comparer cinq critères dans A et B : pulsation, forme, silences, placement du motif, conclusion. La version B est validée si elle conserve au moins 4 critères sur 5 et ne perd pas plus d'un critère par rapport à la version A. Réussir deux paires A-B.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":123},{"kind":"week","id":"S93","number":93,"title":"Transférer le jazz-blues en Fa","objective":"Transposer la grille, les guide tones essentiels et deux motifs seulement.","work":"Grille jazz-blues simplifiée en Fa : M1 F7, M2 B♭7, M3 F7, M4 F7 ; M5 B♭7, M6 B♭7, M7 F7, M8 F7 ; M9 Gm7, M10 C7, M11 F7, M12 F7. Main gauche : fondamentales en rondes. Main droite : deux motifs seulement, A = Fa-La bémol-Si bémol au rythme noire-noire-blanche ; B = Si bémol-La bémol-Fa au même rythme. Travailler un chorus avec ces deux motifs et des silences, puis jouer le thème mémorisé de Bag's Groove comme thème de référence en Fa.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation aux nombreux morceaux en Fa de Tim Richards.","validation":"Jouer le thème de Bag's Groove de mémoire puis un chorus simple sur la grille de Fa avec seulement les deux motifs A et B, au moins trois mesures entièrement silencieuses et aucune perte de forme. Réussir deux prises.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":124},{"kind":"standard","id":"NT10","number":10,"title":"Now’s the Time · passage 3 — Cibler les accords et le turnaround","objective":"Faire entendre les changements de la grille enrichie sans penser à une gamme différente sur chaque accord.","work":"Prévoir une cible sur I, IV, V puis sur le ii–V des mesures finales. L’approcher avec une note de la pentatonique ou un demi-ton inférieur, au maximum une fois par phrase.","ear":"Entendre la cible avant l’approche et la laisser sonner après la résolution.","tim":"Synthèse des guide tones, du mini ii–V et des approches chromatiques.","validation":"Atteindre huit cibles prévues dont deux dans le turnaround, sans perdre le motif.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":125},{"kind":"standard","id":"NT11","number":11,"title":"Now’s the Time · passage 3 — Utiliser la gamme blues autour des cibles","objective":"Élargir le chorus tout en conservant la direction harmonique et le phrasé du thème.","work":"Construire des cellules de deux à quatre notes de la gamme blues de Fa qui aboutissent sur les cibles préparées. Interdire les montées–descentes continues et limiter la blue note à une tension résolue.","ear":"Entendre d’abord la cible, puis seulement le chemin qui y conduit.","tim":"La gamme blues sert désormais le phrasé et l’harmonie.","validation":"Un chorus avec six arrivées entendues, deux motifs et au moins trois silences.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":126},{"kind":"standard","id":"NT12","number":12,"title":"Now’s the Time · passage 3 — Interpréter Now’s the Time comme cinquième standard","objective":"Valider une première entrée dans le bebop sans vitesse ni walking bass imposées.","work":"Thème ; chorus 1 à deux ou trois notes en call & response ; chorus 2 avec motif, gamme blues, cibles et turnaround ; retour du thème. Playback ou comping fixe.","ear":"Anticiper le thème final et préserver ses accents après les solos.","tim":"Cinquième standard complet et pont final entre blues et improvisation jazz.","validation":"Une prise continue thème–deux chorus–thème, avec articulation stable, cibles audibles et thème final exact.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":127},{"kind":"week","id":"S94","number":94,"title":"Petit répertoire d’autonomie","objective":"Choisir trois pièces : une du chapitre 1, C Jam Blues et Blue Monk ou un blues mineur.","work":"Choisir trois pièces comme prévu : une pièce du chapitre 1 de Tim Richards, C Jam Blues et Blue Monk ou un blues mineur. Pour chacune : 1) thème de mémoire ; 2) un chorus de 12 mesures avec 3 à 5 notes maximum, au moins deux mesures entières de silence et un motif répété ; 3) retour bref au thème ou conclusion préparée. Utiliser pour chaque morceau l'accompagnement le plus stable déjà validé.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Répertoire volontairement limité pour favoriser la profondeur.","validation":"Pour les trois pièces, jouer le thème de mémoire et un chorus sans perte de forme. Chaque chorus doit contenir au moins deux mesures silencieuses et un motif identifiable. Les trois morceaux doivent être réussis lors de deux séances différentes.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":128},{"kind":"standard","id":"SET1","number":1,"title":"Mini-répertoire final · passage 1 — Choisir trois standards réellement disponibles","objective":"Constituer un mini-répertoire fondé sur la stabilité plutôt que sur la quantité de morceaux.","work":"Retenir C Jam Blues puis deux standards parmi Bag’s Groove, Tenor Madness, Blue Monk et Now’s the Time. Pour chacun, vérifier thème de mémoire, grille seule, accompagnement de repli et reprise possible après une erreur.","ear":"Écouter le début de chaque thème sans piano et reconnaître le morceau avant la troisième attaque.","tim":"Le livre et les lead sheets deviennent des références ; la performance repose sur la mémoire et l’écoute.","validation":"Les trois thèmes démarrent de mémoire aux mesures 1, 5 et 9 et chaque grille peut être jouée seule.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":129},{"kind":"standard","id":"SET2","number":2,"title":"Mini-répertoire final · passage 1 — Stabiliser C Jam Blues comme morceau d’ouverture","objective":"Choisir une version simple et reproductible du premier standard.","work":"Préparer une introduction de deux mesures ; thème ; chorus 1 contraint ; chorus 2 avec gamme blues ; thème ; conclusion. Choisir à l’avance playback, fondamentales ou comping fixe.","ear":"Entendre le premier motif, la reprise du thème et la dernière note avant la prise.","tim":"C Jam Blues sert de morceau de sécurité du mini-set.","validation":"Deux prises complètes sur deux jours, sans arrêt et avec la même architecture.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":130},{"kind":"standard","id":"SET3","number":3,"title":"Mini-répertoire final · passage 1 — Stabiliser le deuxième standard","objective":"Conserver le caractère propre d’un deuxième morceau sans recopier mécaniquement le solo de C Jam Blues.","work":"Préparer thème, un chorus call & response, un chorus motivique avec cibles, retour du thème et conclusion. Utiliser l’accompagnement le plus simple qui conserve le phrasé.","ear":"Entendre le motif caractéristique du morceau et choisir une note finale différente de celle du premier standard.","tim":"Le répertoire devient contrasté par le riff, la tonalité ou le chromatisme.","validation":"Deux prises continues dont le thème, le motif et la conclusion identifient clairement le morceau.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":131},{"kind":"standard","id":"SET4","number":4,"title":"Mini-répertoire final · passage 1 — Stabiliser le troisième standard","objective":"Ajouter un troisième morceau sans augmenter la densité ou le tempo par obligation.","work":"Préparer la même architecture, mais choisir un seul défi : nouvelle tonalité, turnaround ou chromatisme. Toutes les autres variables reviennent au niveau de repli.","ear":"Entendre le changement choisi et reconnaître le thème final avant son entrée.","tim":"Troisième couleur du mini-répertoire, avec une seule difficulté distinctive.","validation":"Deux prises continues sur deux jours ; la difficulté choisie reste stable et les autres dimensions demeurent simples.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":132},{"kind":"standard","id":"SET5","number":5,"title":"Mini-répertoire final · passage 1 — Enregistrer un mini-set de trois standards","objective":"Valider l’autonomie, la récupération et la mémoire sur une séquence plus longue qu’un morceau isolé.","work":"Enchaîner les trois standards avec une courte pause entre eux. Une seule prise par morceau ; ne pas recommencer après une erreur. Noter ensuite trois réussites et un seul axe de travail par morceau.","ear":"Avant chaque départ, entendre intérieurement le premier motif et le tempo. Après chaque morceau, conserver quelques secondes de silence.","tim":"Synthèse finale du parcours blues et point de départ possible du parcours jazz.","validation":"Trois performances complètes, formes intactes, retours de thèmes identifiables et récupération musicale après toute erreur.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":133},{"kind":"week","id":"S95","number":95,"title":"Simulation de performance enregistrée","objective":"Format : introduction courte, thème, trois chorus, retour au thème, conclusion.","work":"Faire une seule prise, l’écouter le lendemain et noter trois réussites et un seul axe de travail.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Pièce au choix du répertoire construit.","validation":"Aucune interruption ; une erreur est intégrée musicalement sans retour en arrière.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":134},{"kind":"week","id":"S96","number":96,"title":"Bilan final et suite du parcours","objective":"Repasser les tests des semaines 12, 24, 36, 48, 60, 72 et 78 pour mesurer le gain réel.","work":"Repasser les checkpoints S12, S24, S36, S48, S60, S72 et S78 en utilisant exactement leurs critères précisés dans ce document. Puis enregistrer une performance finale d'un standard choisi : thème, deux chorus improvisés, retour au thème et conclusion. Après écoute, noter trois acquis réellement stables et trois objectifs pour les 12 semaines suivantes.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Le livre devient une banque de morceaux et de styles, non une progression à suivre intégralement.","validation":"Le bilan est validé si chaque checkpoint atteint son seuil propre ou si l'écart restant est explicitement identifié, et si la performance finale est continue, garde la forme, contient au moins un motif développé, des silences et un retour exact au thème. Les trois objectifs suivants doivent être formulés comme des compétences observables.","phaseNumber":8,"phaseTitle":"Construire le pont vers l’improvisation jazz","routeIndex":135}];
const referenceUnits = [{"kind":"week","id":"S1","number":1,"title":"Pulsation stable avant les notes","objective":"Sentir quatre temps réguliers à 50-60 BPM : marcher, compter « 1-2-3-4 » et frapper les temps 2 et 4.","work":"Au piano, jouer un Do médium uniquement sur le temps 1 de chaque mesure. Aucun travail de main gauche.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Hors livre : écoute active d’un blues lent et repérage corporel de la pulsation.","validation":"Tenir deux minutes sans accélérer ni ajouter de frappes ; recommencer sur deux jours différents.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":1},{"kind":"week","id":"S2","number":2,"title":"Binaire, ternaire et shuffle","objective":"Alterner croches droites puis croches shuffle sur une seule note ; vocaliser « long-court » sans crisper le poignet.","work":"Main gauche silencieuse. Main droite : Do médium uniquement. Avec métronome à 50-60 BPM, jouer 4 mesures de croches binaires régulières sur Do, puis 4 mesures de croches shuffle en vocalisant « long-court ». Répéter ce bloc deux fois. Ensuite jouer 16 mesures de shuffle seules sans changer le tempo. La main gauche reste posée mais ne joue pas.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Hors livre : comparer deux enregistrements, l’un binaire et l’autre shuffle.","validation":"Identifier correctement le feel de quatre extraits sur cinq et jouer 16 mesures de shuffle sur Do sans accélérer, sans revenir involontairement au binaire et sans crispation. Réussir sur deux jours différents.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":2},{"kind":"week","id":"S3","number":3,"title":"Mémoriser la forme des 12 mesures","objective":"Dire les degrés sur un playback : I-I-I-I / IV-IV-I-I / V-IV-I-I. Pointer une carte I, IV ou V à chaque mesure.","work":"Jouer seulement les fondamentales Do, Fa et Sol sur le premier temps, une note par mesure, sans improviser.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation au chapitre 1 : triades I, IV et V en Do.","validation":"Suivre trois grilles consécutives sans se perdre ; si une erreur survient, retrouver la mesure suivante sans arrêter.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":3},{"kind":"week","id":"S4","number":4,"title":"Improviser avec une seule note","objective":"Sur un playback, improviser avec Do uniquement : d’abord des blanches et des noires, puis des silences.","work":"Aucune main gauche. Une phrase ne dépasse pas deux mesures ; laisser au moins une mesure vide sur quatre.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Hors livre : première expérience d’improvisation sans charge de coordination.","validation":"Produire deux chorus différents sans jouer en continu et sans quitter la pulsation.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":4},{"kind":"week","id":"S5","number":5,"title":"Créer du rythme avec une seule note","objective":"Construire quatre cellules : deux noires ; noire-silence-noire ; blanche ; syncope simple préparée par imitation.","work":"Playback seul, main gauche silencieuse, Do médium uniquement. Apprendre quatre cellules d'une mesure : A = Do noire sur 1, silence sur 2, Do noire sur 3, silence sur 4 ; B = Do noire sur 1, silence sur 2, Do noire sur 3, Do noire sur 4 ; C = Do blanche sur 1-2 puis silence sur 3-4 ; D = silence sur 1-2, Do sur le « et » de 2 tenu jusqu'au temps 3, puis silence jusqu'à la fin de la mesure. Pour chaque cellule : jouer le modèle, laisser une mesure entière de silence, le rejouer à l'identique, puis faire une variante en ne changeant qu'une attaque ou une durée.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Hors livre : le rythme devient le premier vocabulaire d’improvisation.","validation":"Rejouer deux cellules à l'identique puis produire pour chacune une variante volontairement différente, en pouvant dire ce qui a changé. Réussir trois séquences modèle-répétition-variante sur au moins deux jours.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":5},{"kind":"week","id":"S6","number":6,"title":"Deux notes : question et réponse","objective":"Utiliser seulement Do et Mi bémol. La question monte ; la réponse revient vers Do. Limiter chaque phrase à quatre sons.","work":"Playback seul, main gauche silencieuse. Main droite : Do et Mi bémol uniquement. Travailler par cycles de quatre mesures : M1 question de 2 à 4 attaques qui tend vers Mi bémol ; M2 silence complet ; M3 réponse de 2 à 4 attaques qui finit sur Do ; M4 silence complet. Une fois sur deux, vocaliser le rythme et la dernière note de la réponse avant de la jouer.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation à la tierce bleue du chapitre 1.","validation":"Enregistrer un chorus de 12 mesures contenant exactement trois cycles question-silence-réponse-silence. Les trois réponses finissent sur Do, les deux mesures de silence de chaque cycle restent réellement silencieuses et la forme n'est jamais perdue.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":6},{"kind":"week","id":"S7","number":7,"title":"Trois notes et premiers motifs","objective":"Ajouter Fa. Créer trois motifs de trois notes et les apprendre comme des mots, avec un rythme précis.","work":"Playback seul, main gauche silencieuse. Main droite : Do, Mi bémol, Fa. Apprendre trois motifs d'une mesure : A = Do noire sur 1, Mi bémol noire sur 2, Fa blanche sur 3-4 ; B = Fa noire sur 1, Mi bémol noire sur 2, Do blanche sur 3-4 ; C = Do blanche sur 1-2, Fa noire sur 3, Mi bémol noire sur 4. Choisir un seul motif pour un chorus : le jouer, le répéter à l'identique au moins deux fois, puis ne changer que son rythme lors des occurrences suivantes.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation au vocabulaire de Five-Finger Blues.","validation":"Un chorus complet où un motif choisi apparaît au moins trois fois : deux occurrences identiques puis au moins une variation rythmique volontaire. Aucune autre note que Do, Mi bémol et Fa.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":7},{"kind":"week","id":"S8","number":8,"title":"Respiration et longueur des phrases","objective":"Alterner une mesure jouée et une mesure silencieuse, puis deux mesures jouées et deux silencieuses.","work":"Playback seul, main gauche silencieuse, uniquement Do-Mi bémol-Fa. Chorus 1 : alterner strictement une mesure jouée / une mesure silencieuse sur 12 mesures. Chorus 2 : alterner deux mesures jouées / deux mesures silencieuses. Dans les mesures jouées, limiter chaque phrase à 2-4 attaques et ne pas prolonger une phrase dans la mesure de silence suivante.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Hors livre : apprentissage du phrasé avant l’augmentation du nombre de notes.","validation":"Deux chorus continus respectant exactement les alternances 1/1 puis 2/2, avec des débuts et fins de phrases clairement perceptibles et aucune attaque dans les mesures prévues silencieuses.","phaseNumber":1,"phaseTitle":"Improviser avant de coordonner","routeIndex":8},{"kind":"week","id":"S9","number":9,"title":"Quatre notes et variation d’une seule variable","objective":"Ajouter Sol. Pour chaque reprise du motif, changer soit le rythme, soit la dernière note, jamais les deux à la fois.","work":"Playback seul, main gauche silencieuse, notes autorisées Do-Mi bémol-Fa-Sol dans une seule zone du clavier. Organiser le chorus en trois blocs de quatre mesures. Dans chaque bloc : M1 motif de 2 à 4 notes ; M2 répétition exacte ; M3 mêm function todayInParis() {
    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
    }).formatToParts(new Date());
    const value = Object.fromEntries(parts.map((part) => [part.type, part.value]));
    return `${value.year}-${value.month}-${value.day}`;
}

function dateFromISO(iso) {
    if (!iso)
        return null;
    const candidate = new Date(`${iso}T12:00:00`);
    return Number.isNaN(candidate.getTime()) ? null : candidate;
}
function addDays(iso, days) {
    const date = dateFromISO(iso);
    if (!date)
        return "";
    date.setDate(date.getDate() + days);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}
function formatDate(iso, compact = false) {
    const date = dateFromISO(iso);
    if (!date)
        return "Date à renseigner";
    return new Intl.DateTimeFormat("fr-FR", {
        weekday: compact ? undefined : "short",
        day: "numeric",
        month: compact ? "short" : "long",
        year: compact ? undefined : "numeric",
    }).format(date);
}
function formatMonth(key) {
    const monthNumber = Number(key.replace("month-", ""));
    return Number.isFinite(monthNumber)
        ? `Mois pédagogique ${monthNumber}`
        : "Mois pédagogique";
}
