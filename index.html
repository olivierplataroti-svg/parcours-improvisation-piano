<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10283c">
<title>Mon parcours d’improvisation blues & jazz</title>
<meta name="description" content="Parcours personnalisé de piano, suivi mois par mois, semaine par semaine et séance par séance.">
<style>:root {
  --navy-950: #10283c;
  --navy-900: #17324d;
  --navy-800: #1f4d78;
  --blue-600: #2e74b5;
  --blue-100: #e8eef5;
  --blue-50: #f4f7fa;
  --gold-500: #c8952d;
  --gold-100: #fff4dc;
  --green-700: #2f6b4f;
  --green-100: #eaf5ee;
  --ink: #20252a;
  --muted: #64717e;
  --line: #dce3e9;
  --paper: #ffffff;
  --canvas: #eef2f5;
  --shadow: 0 18px 50px rgba(23, 50, 77, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--canvas);
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family:
    Inter, "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(46, 116, 181, 0.25);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 30px 22px;
  background: var(--navy-950);
  color: white;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 7px 30px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--gold-500);
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 29px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 15px;
  letter-spacing: 0.01em;
}

.brand small {
  margin-top: 2px;
  color: #aab9c6;
  font-size: 11px;
}

.sidebar nav {
  display: grid;
  gap: 6px;
}

.nav-item {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #c3ced8;
  text-align: left;
  cursor: pointer;
  transition:
    background 150ms ease,
    color 150ms ease,
    transform 150ms ease;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.07);
  color: white;
  transform: translateX(2px);
}

.nav-item.is-active {
  background: #234d70;
  color: white;
  box-shadow: inset 3px 0 0 var(--gold-500);
}

.nav-item span,
.nav-item small {
  display: block;
}

.nav-item span {
  font-size: 14px;
  font-weight: 700;
}

.nav-item small {
  margin-top: 2px;
  color: #91a5b7;
  font-size: 10px;
}

.nav-item.is-active small {
  color: #bfd0df;
}

.sidebar-note {
  margin-top: auto;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.055);
}

.sidebar-note p {
  margin: 8px 0 0;
  color: #becbd6;
  font-size: 11px;
  line-height: 1.55;
}

.main {
  min-width: 0;
  padding: 30px 38px 52px;
}

.topbar {
  max-width: 1380px;
  margin: 0 auto 24px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.topbar h1 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(28px, 3vw, 43px);
  font-weight: 500;
  letter-spacing: -0.025em;
}

.eyebrow {
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: var(--navy-900);
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.button {
  min-height: 40px;
  padding: 9px 16px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  transition:
    transform 140ms ease,
    box-shadow 140ms ease,
    background 140ms ease;
}

.button:hover {
  transform: translateY(-1px);
}

.button--primary {
  background: var(--blue-600);
  color: white;
  box-shadow: 0 9px 22px rgba(46, 116, 181, 0.24);
}

.button--primary:hover {
  background: #27679f;
}

.button--quiet {
  border-color: var(--line);
  background: white;
  color: var(--navy-800);
}

.button--ghost {
  border-color: rgba(255, 255, 255, 0.34);
  background: transparent;
  color: white;
}

.page-stack {
  max-width: 1380px;
  margin: 0 auto;
  display: grid;
  gap: 20px;
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(250px, 0.9fr);
  gap: 20px;
}

.hero-card,
.status-card,
.content-card {
  border: 1px solid rgba(23, 50, 77, 0.08);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.hero-card {
  min-height: 318px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  overflow: hidden;
  background:
    radial-gradient(circle at 85% 15%, rgba(200, 149, 45, 0.18), transparent 28%),
    linear-gradient(140deg, var(--navy-950), #1d4d70);
  color: white;
}

.hero-copy {
  padding: 36px 0 34px 38px;
}

.pill {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.pill--gold {
  background: var(--gold-100);
  color: #7c5912;
}

.unit-kicker {
  margin: 20px 0 5px;
  color: #aebfce;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.hero-card h2 {
  max-width: 620px;
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(29px, 3.4vw, 48px);
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -0.025em;
}

.hero-objective {
  max-width: 660px;
  margin: 16px 0 0;
  color: #d9e2e9;
  font-size: 13px;
  line-height: 1.65;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 24px;
}

.hero-progress {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.progress-ring {
  width: 142px;
  height: 142px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(
    var(--gold-500) var(--progress-deg, 0deg),
    rgba(255, 255, 255, 0.13) 0deg
  );
  position: relative;
}

.progress-ring::after {
  position: absolute;
  width: 116px;
  height: 116px;
  border-radius: 50%;
  background: #173d59;
  content: "";
}

.progress-ring div {
  position: relative;
  z-index: 1;
}

.progress-ring strong,
.progress-ring span {
  display: block;
}

.progress-ring strong {
  font-family: Georgia, serif;
  font-size: 32px;
}

.progress-ring span {
  color: #b7c6d2;
  font-size: 10px;
}

.hero-progress p {
  margin: 15px 0 3px;
  font-size: 12px;
  font-weight: 800;
}

.hero-progress small {
  max-width: 160px;
  color: #aebfce;
  font-size: 9px;
  line-height: 1.4;
}

.status-card {
  padding: 27px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.status-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.status-dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--green-700);
  font-size: 9px;
  font-weight: 800;
}

.status-dot::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #55a174;
  content: "";
}

.big-number {
  margin-top: 22px;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 57px;
  font-weight: 500;
  line-height: 0.9;
}

.big-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;
}

.mini-stat-row {
  margin-top: 30px;
  padding-top: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  border-top: 1px solid var(--line);
}

.mini-stat-row div {
  display: grid;
  gap: 2px;
}

.mini-stat-row strong {
  color: var(--navy-800);
  font-size: 17px;
}

.mini-stat-row span {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.section-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, 0.8fr);
  gap: 20px;
}

.content-card {
  padding: 26px;
}

.card-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.card-heading h3,
.anchor-card h3 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.week-badge {
  min-width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--blue-100);
  color: var(--navy-800);
  font-size: 12px;
  font-weight: 850;
}

.details-grid {
  margin-top: 21px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-field {
  padding: 15px 16px;
  border-left: 3px solid var(--blue-600);
  border-radius: 8px;
  background: var(--blue-50);
}

.detail-field--gold {
  border-left-color: var(--gold-500);
  background: #fffaf0;
}

.detail-field--green {
  border-left-color: var(--green-700);
  background: var(--green-100);
}

.detail-field span {
  color: var(--navy-800);
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.detail-field p {
  margin: 5px 0 0;
  color: #48545e;
  font-size: 11px;
  line-height: 1.55;
}

.anchor-card {
  background: #fffaf0;
}

.anchor-card p {
  margin: 15px 0 0;
  color: #56616a;
  font-size: 12px;
  line-height: 1.65;
}

.anchor-line {
  margin-top: 22px;
  padding-top: 18px;
  display: grid;
  gap: 4px;
  border-top: 1px solid #eadab6;
}

.anchor-line span {
  color: #8b7550;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.anchor-line strong {
  color: #71541a;
  font-size: 12px;
}

.text-button {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--blue-600);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.phase-strip {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(6, minmax(125px, 1fr));
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.phase-tile {
  min-height: 124px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fbfcfd;
}

.phase-tile.is-current {
  border-color: #9ebdd7;
  background: var(--blue-100);
}

.phase-tile span {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.phase-tile strong {
  margin-top: 9px;
  color: var(--navy-950);
  font-size: 11px;
  line-height: 1.35;
}

.phase-tile small {
  margin-top: auto;
  padding-top: 10px;
  color: var(--muted);
  font-size: 9px;
}

.placeholder {
  max-width: 800px;
  margin: 80px auto 0;
  padding: 56px;
  text-align: center;
}

.placeholder h2 {
  margin: 8px 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 500;
}

.placeholder p {
  max-width: 520px;
  margin: 0 auto 24px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.mobile-nav {
  display: none;
}

@media (max-width: 1080px) {
  .app-shell {
    grid-template-columns: 210px minmax(0, 1fr);
  }

  .sidebar {
    padding-inline: 16px;
  }

  .main {
    padding-inline: 24px;
  }

  .hero-grid,
  .section-grid {
    grid-template-columns: 1fr;
  }

  .status-card {
    display: grid;
    grid-template-columns: auto auto 1fr;
    column-gap: 22px;
  }

  .status-heading {
    grid-column: 1 / -1;
  }

  .big-number {
    margin-top: 18px;
  }

  .big-label {
    align-self: end;
    margin-bottom: 5px;
  }

  .mini-stat-row {
    margin: 16px 0 0;
    padding: 0 0 0 22px;
    align-self: center;
    border-top: 0;
    border-left: 1px solid var(--line);
  }
}

@media (max-width: 760px) {
  .app-shell {
    display: block;
  }

  .sidebar {
    display: none;
  }

  .main {
    padding: 22px 16px 88px;
  }

  .topbar {
    align-items: center;
  }

  .topbar h1 {
    font-size: 27px;
  }

  .top-actions .button {
    display: none;
  }

  .mobile-nav {
    position: sticky;
    top: 8px;
    z-index: 20;
    margin: 0 -4px 18px;
    padding: 5px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 10px 28px rgba(23, 50, 77, 0.1);
    backdrop-filter: blur(12px);
  }

  .mobile-nav button {
    flex: 0 0 auto;
    padding: 8px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-weight: 750;
  }

  .mobile-nav button.is-active {
    background: var(--navy-900);
    color: white;
  }

  .hero-card {
    min-height: 0;
    grid-template-columns: 1fr;
  }

  .hero-copy {
    padding: 28px 24px 20px;
  }

  .hero-card h2 {
    font-size: 35px;
  }

  .hero-progress {
    padding: 16px 24px 27px;
    flex-direction: row;
    justify-content: flex-start;
    gap: 14px;
    text-align: left;
  }

  .progress-ring {
    width: 82px;
    height: 82px;
    flex: 0 0 auto;
  }

  .progress-ring::after {
    width: 66px;
    height: 66px;
  }

  .progress-ring strong {
    font-size: 21px;
  }

  .hero-progress p,
  .hero-progress small {
    margin: 0;
  }

  .status-card {
    display: flex;
  }

  .mini-stat-row {
    margin-top: 24px;
    padding: 18px 0 0;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .details-grid {
    grid-template-columns: 1fr;
  }

  .content-card {
    padding: 21px;
  }

  .card-heading {
    align-items: center;
  }

  .card-heading .text-button {
    display: none;
  }

  .phase-strip {
    grid-template-columns: repeat(6, 142px);
  }
}

@media print {
  .sidebar,
  .mobile-nav,
  .top-actions,
  .hero-actions {
    display: none !important;
  }

  .app-shell {
    display: block;
  }

  .main {
    padding: 0;
  }

  .hero-card,
  .status-card,
  .content-card {
    break-inside: avoid;
    box-shadow: none;
  }
}

/* Suivi, parcours et journal */

.save-state {
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
}

.sidebar-progress {
  margin-top: 24px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
}

.sidebar-progress > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sidebar-progress span {
  color: #b7c5d1;
  font-size: 9px;
  font-weight: 750;
}

.sidebar-progress strong {
  color: white;
  font-size: 13px;
}

.sidebar-progress small {
  display: block;
  margin-top: 7px;
  color: #8fa3b4;
  font-size: 8px;
}

.linear-progress {
  width: 100%;
  height: 5px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(142, 161, 176, 0.22);
}

.linear-progress span {
  height: 100%;
  display: block;
  border-radius: inherit;
  background: var(--gold-500);
  transition: width 240ms ease;
}

.phase-tile .linear-progress {
  margin-top: 8px;
}

.phase-tile .linear-progress span {
  background: var(--blue-600);
}

.status-badge {
  display: inline-flex;
  width: max-content;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.035em;
  white-space: nowrap;
}

.status-badge::before {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  content: "";
}

.status-badge--not_started {
  background: #edf1f4;
  color: #64717e;
}

.status-badge--not_started::before {
  background: #9aa7b1;
}

.status-badge--in_progress {
  background: var(--gold-100);
  color: #795715;
}

.status-badge--in_progress::before {
  background: var(--gold-500);
}

.status-badge--mastered {
  background: var(--green-100);
  color: var(--green-700);
}

.status-badge--mastered::before {
  background: #4c956b;
}

.status-badge--paused {
  background: #f6eaea;
  color: #8d4444;
}

.status-badge--paused::before {
  background: #ad5e5e;
}

.button--success {
  background: var(--green-700);
  color: white;
}

.button--danger {
  border-color: #efcaca;
  background: #fff3f3;
  color: #963f3f;
}

.session-mini-grid {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 11px;
}

.session-mini,
.unit-session {
  min-width: 0;
  padding: 14px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fbfcfd;
}

.session-mini.is-complete,
.unit-session.is-complete {
  border-color: #b9d7c5;
  background: var(--green-100);
}

.session-check {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border: 1px solid #b4c6d4;
  border-radius: 8px;
  background: white;
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}

.is-complete .session-check {
  border-color: #6ba284;
  background: var(--green-700);
  color: white;
}

.session-mini div,
.unit-session div {
  min-width: 0;
}

.session-mini div > span,
.unit-session div > span {
  display: block;
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
}

.session-mini div > strong,
.unit-session div > strong {
  display: block;
  margin-top: 4px;
  color: var(--navy-950);
  font-size: 11px;
  line-height: 1.35;
}

.session-mini div > small,
.unit-session div > small {
  display: -webkit-box;
  margin-top: 5px;
  overflow: hidden;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.mini-edit {
  grid-column: 2;
  justify-self: start;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--blue-600);
  font-size: 9px;
  font-weight: 800;
  cursor: pointer;
}

.validation-banner {
  margin-top: 16px;
  padding: 15px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid #b8d9c5;
  border-radius: 12px;
  background: var(--green-100);
}

.validation-banner strong,
.validation-banner span {
  display: block;
}

.validation-banner strong {
  color: var(--green-700);
  font-size: 11px;
}

.validation-banner span {
  margin-top: 3px;
  color: #54705f;
  font-size: 9px;
}

.view-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  background:
    linear-gradient(110deg, rgba(232, 238, 245, 0.76), rgba(255, 255, 255, 0.9)),
    white;
}

.view-intro h2,
.month-navigator h2,
.reference-hero h2,
.final-outcome h2 {
  margin: 6px 0 0;
  color: var(--navy-950);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(27px, 3vw, 39px);
  font-weight: 500;
  letter-spacing: -0.02em;
}

.view-intro p,
.month-navigator > p,
.reference-hero > div > p,
.section-lead {
  max-width: 740px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.intro-stat {
  min-width: 150px;
  padding-left: 24px;
  display: grid;
  border-left: 1px solid var(--line);
}

.intro-stat strong {
  color: var(--navy-800);
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 500;
}

.intro-stat span {
  color: var(--muted);
  font-size: 9px;
}

.filter-bar {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 190px 170px auto;
  align-items: end;
  gap: 11px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.82);
}

.filter-bar--sessions {
  grid-template-columns: minmax(240px, 1.2fr) 180px minmax(210px, 1fr) auto;
}

.filter-bar label,
.unit-toolbar label,
.editor-form label,
.review-notes,
.settings-date {
  display: grid;
  gap: 6px;
}

.filter-bar label > span,
.unit-toolbar label > span,
.editor-form label > span,
.review-notes > span,
.settings-date > span {
  color: var(--navy-800);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.075em;
  text-transform: uppercase;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid #cad5de;
  border-radius: 9px;
  background: white;
  color: var(--ink);
}

input,
select {
  min-height: 39px;
  padding: 8px 10px;
  font-size: 11px;
}

textarea {
  padding: 10px 11px;
  font-size: 11px;
  line-height: 1.55;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: #9ba6af;
}

.result-count {
  min-height: 39px;
  padding: 11px 3px 0;
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  white-space: nowrap;
}

.unit-list {
  display: grid;
  gap: 9px;
}

.unit-card {
  scroll-margin-top: 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
  box-shadow: 0 8px 28px rgba(23, 50, 77, 0.035);
}

.unit-card.is-open {
  border-color: #a9c4d9;
  box-shadow: var(--shadow);
}

.unit-open {
  width: 100%;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) 88px 92px 24px;
  align-items: center;
  gap: 12px;
  border: 0;
  background: white;
  text-align: left;
  cursor: pointer;
}

.unit-open:hover {
  background: var(--blue-50);
}

.unit-card.is-open .unit-open {
  background: var(--blue-100);
}

.unit-number {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--navy-900);
  color: white;
  font-size: 10px;
  font-weight: 900;
}

.unit-title-block {
  min-width: 0;
}

.unit-title-block small,
.unit-title-block strong {
  display: block;
}

.unit-title-block small {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.unit-title-block strong {
  margin-top: 4px;
  overflow: hidden;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.unit-session-progress {
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  text-align: right;
}

.chevron {
  color: var(--blue-600);
  font-size: 20px;
  text-align: center;
}

.unit-detail {
  padding: 0 20px 22px;
  border-top: 1px solid #cad9e4;
  background: #fbfcfd;
}

.unit-toolbar {
  padding: 14px 0;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
}

.unit-toolbar label {
  width: 190px;
}

.details-grid--unit {
  margin-top: 2px;
}

.tim-callout {
  margin-top: 12px;
  padding: 13px 15px;
  border: 1px dashed #d4bd88;
  border-radius: 10px;
  background: #fffaf0;
}

.tim-callout span {
  color: #80611d;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.tim-callout p {
  margin: 4px 0 0;
  color: #66583d;
  font-size: 10px;
  line-height: 1.5;
}

.unit-session-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 9px;
}

.unit-session {
  padding: 11px;
}

.empty-state {
  display: grid;
  place-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

/* Vue mensuelle */

.month-navigator {
  overflow: hidden;
}

.month-tabs {
  margin: 22px -26px -26px;
  padding: 14px 26px 18px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  border-top: 1px solid var(--line);
  background: var(--blue-50);
}

.month-tabs button {
  min-width: 105px;
  padding: 10px;
  display: grid;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  text-align: left;
  cursor: pointer;
}

.month-tabs button.is-active {
  border-color: var(--blue-600);
  background: var(--navy-900);
  color: white;
}

.month-tabs span {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
}

.month-tabs button.is-active span {
  color: #9fc6e5;
}

.month-tabs strong {
  font-size: 11px;
}

.month-tabs small {
  color: var(--muted);
  font-size: 7px;
}

.month-tabs button.is-active small {
  color: #b8c8d5;
}

.calendar-weeks {
  display: grid;
  gap: 13px;
}

.calendar-week {
  padding: 22px;
}

.calendar-week-heading {
  display: grid;
  grid-template-columns: 105px minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
}

.calendar-date {
  padding-right: 15px;
  display: grid;
  border-right: 1px solid var(--line);
}

.calendar-date span,
.calendar-week-heading small {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
}

.calendar-date strong {
  margin-top: 3px;
  color: var(--navy-800);
  font-size: 11px;
}

.calendar-week-heading h3 {
  margin: 3px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: 500;
}

.calendar-status {
  display: grid;
  justify-items: end;
  gap: 5px;
}

.calendar-status > span {
  color: var(--muted);
  font-size: 8px;
}

.calendar-objective {
  margin: 14px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
}

.calendar-session-row {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.calendar-session {
  padding: 9px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fbfcfd;
}

.calendar-session.is-complete {
  border-color: #b9d7c5;
  background: var(--green-100);
}

.calendar-session-open {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.calendar-session-open span,
.calendar-session-open strong {
  display: block;
}

.calendar-session-open span {
  color: var(--blue-600);
  font-size: 7px;
  font-weight: 800;
}

.calendar-session-open strong {
  margin-top: 2px;
  overflow: hidden;
  color: var(--navy-950);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calendar-actions {
  margin-top: 13px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
}

.monthly-review-summary {
  display: grid;
  grid-template-columns: minmax(210px, 0.8fr) minmax(300px, 1.4fr) auto;
  align-items: center;
  gap: 24px;
  background: #fffaf0;
}

.monthly-review-summary h3 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.monthly-review-summary p {
  color: #6a604d;
  font-size: 10px;
  line-height: 1.6;
}

/* Journal des séances */

.session-list {
  display: grid;
  gap: 9px;
}

.session-row {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: auto 120px minmax(240px, 1fr) 170px auto;
  align-items: center;
  gap: 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  box-shadow: 0 8px 25px rgba(23, 50, 77, 0.035);
}

.session-row.is-complete {
  border-color: #b9d7c5;
  background: linear-gradient(90deg, var(--green-100), white 35%);
}

.session-check--large {
  width: 36px;
  height: 36px;
  font-size: 11px;
}

.session-row-date {
  display: grid;
  gap: 3px;
}

.session-row-date span {
  color: var(--navy-800);
  font-size: 9px;
  font-weight: 800;
}

.session-row-date small {
  color: var(--muted);
  font-size: 8px;
}

.session-row-main {
  min-width: 0;
}

.session-row-main > span {
  display: block;
  overflow: hidden;
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.session-row-main > strong {
  display: block;
  margin-top: 2px;
  color: var(--navy-950);
  font-size: 12px;
}

.session-row-main > p {
  margin: 3px 0 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-preview {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  color: #876b2b;
  font-size: 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-row-meta {
  display: grid;
  justify-items: start;
  gap: 5px;
  color: var(--muted);
  font-size: 8px;
}

.saved-chip {
  padding: 3px 6px;
  border-radius: 999px;
  background: var(--blue-100);
  color: var(--blue-600);
  font-weight: 800;
}

.load-more {
  min-height: 48px;
  border: 1px dashed #9fb9cd;
  border-radius: 12px;
  background: var(--blue-50);
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 850;
  cursor: pointer;
}

/* Référentiel */

.reference-stack h3 {
  margin: 6px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.reference-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.8fr);
  gap: 28px;
  background:
    radial-gradient(circle at 92% 10%, rgba(200, 149, 45, 0.17), transparent 32%),
    white;
}

.reference-decision {
  padding: 22px;
  border-radius: 14px;
  background: var(--green-100);
}

.reference-decision strong {
  color: var(--green-700);
  font-size: 11px;
}

.reference-decision p {
  margin: 8px 0 0;
  color: #526b5c;
  font-size: 10px;
  line-height: 1.65;
}

.profile-table {
  margin-top: 20px;
  display: grid;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.profile-table article {
  display: grid;
  grid-template-columns: 150px 1fr 1.25fr;
  gap: 18px;
  padding: 13px 15px;
}

.profile-table article:nth-child(even) {
  background: var(--blue-50);
}

.profile-table strong {
  color: var(--navy-800);
  font-size: 10px;
}

.profile-table p {
  margin: 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.reference-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.clean-list {
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 10px;
  list-style: none;
  counter-reset: guide-list;
}

ol.clean-list li {
  counter-increment: guide-list;
}

.clean-list li {
  position: relative;
  padding-left: 28px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
}

.clean-list li::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: var(--blue-100);
  color: var(--blue-600);
  content: "•";
  font-size: 11px;
  font-weight: 900;
}

ol.clean-list li::before {
  content: counter(guide-list);
  font-size: 8px;
}

.soft-callout {
  margin: 18px 0 0;
  padding: 12px 13px;
  border-left: 3px solid var(--gold-500);
  border-radius: 7px;
  background: #fffaf0;
  color: #746344;
  font-size: 9px;
  line-height: 1.55;
}

.jazz-prep-grid {
  margin-top: 19px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.jazz-prep-grid article {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--blue-50);
}

.jazz-prep-grid strong {
  color: var(--navy-800);
  font-size: 10px;
}

.jazz-prep-grid p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.rule-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.rule-grid article {
  padding: 13px;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.rule-grid article > span {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--navy-900);
  color: white;
  font-size: 9px;
  font-weight: 850;
}

.rule-grid strong {
  color: var(--navy-800);
  font-size: 10px;
}

.rule-grid p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
}

.fallback-ladder {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.fallback-ladder article {
  min-height: 74px;
  padding: 12px;
  display: grid;
  grid-template-columns: 23px 1fr;
  align-items: start;
  gap: 8px;
  border-radius: 10px;
  background: var(--blue-50);
}

.fallback-ladder span {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold-500);
  color: var(--navy-950);
  font-size: 8px;
  font-weight: 900;
}

.fallback-ladder p {
  margin: 2px 0 0;
  color: var(--navy-800);
  font-size: 9px;
  line-height: 1.45;
}

.missing-step-table {
  margin-top: 20px;
  display: grid;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.missing-step-table article {
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 190px 1fr 1fr;
  gap: 16px;
}

.missing-step-table article:nth-child(even) {
  background: var(--blue-50);
}

.missing-step-table strong {
  color: var(--navy-800);
  font-size: 9px;
}

.missing-step-table p {
  margin: 0;
  color: var(--muted);
  font-size: 8.5px;
  line-height: 1.5;
}

.reference-search {
  max-width: 420px;
  margin-top: 18px;
  display: grid;
  gap: 6px;
}

.reference-search > span {
  color: var(--navy-800);
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
}

.reference-unit-list {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.reference-unit {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.reference-unit > button {
  width: 100%;
  padding: 10px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 9px;
  border: 0;
  background: white;
  text-align: left;
  cursor: pointer;
}

.reference-unit.is-open > button {
  background: var(--blue-100);
}

.reference-unit > button span {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--navy-900);
  color: white;
  font-size: 8px;
  font-weight: 850;
}

.reference-unit > button strong {
  overflow: hidden;
  color: var(--navy-950);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reference-unit > button small {
  max-width: 140px;
  overflow: hidden;
  color: var(--muted);
  font-size: 7px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reference-unit > button b {
  color: var(--blue-600);
  font-size: 16px;
}

.reference-unit > div {
  padding: 10px;
  display: grid;
  gap: 7px;
  background: #fbfcfd;
}

.reference-unit .detail-field {
  padding: 10px;
}

.deferred-list {
  margin-top: 18px;
  display: grid;
  gap: 9px;
}

.deferred-list article {
  padding: 12px;
  border-left: 3px solid var(--gold-500);
  border-radius: 8px;
  background: #fffaf0;
}

.deferred-list strong {
  color: #71541a;
  font-size: 9px;
}

.deferred-list p {
  margin: 5px 0 0;
  color: #746344;
  font-size: 9px;
  line-height: 1.55;
}

.final-outcome {
  padding: 36px;
  border-radius: 20px;
  background:
    radial-gradient(circle at 90% 20%, rgba(200, 149, 45, 0.2), transparent 30%),
    var(--navy-950);
  color: white;
}

.final-outcome .eyebrow {
  color: #e8c36f;
}

.final-outcome h2 {
  max-width: 900px;
  color: white;
}

.final-outcome p {
  max-width: 880px;
  margin: 15px 0 0;
  color: #c6d2dc;
  font-size: 11px;
  line-height: 1.7;
}

/* Éditeurs et sauvegarde */

.drawer-layer,
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  justify-items: end;
}

.modal-layer {
  place-items: center;
}

.drawer-scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: rgba(9, 27, 42, 0.58);
  backdrop-filter: blur(3px);
  cursor: pointer;
}

.drawer {
  position: relative;
  z-index: 1;
  width: min(680px, 94vw);
  height: 100vh;
  padding: 27px 30px 42px;
  overflow-y: auto;
  background: white;
  box-shadow: -20px 0 60px rgba(10, 30, 47, 0.22);
  animation: drawer-in 180ms ease-out;
}

@keyframes drawer-in {
  from {
    transform: translateX(30px);
    opacity: 0;
  }
}

.drawer-heading {
  display: flex;
  align-items: flex-start;
