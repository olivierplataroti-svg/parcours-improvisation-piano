<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10283c">
<title>Mon parcours d’improvisation blues & jazz</title>
<meta name="description" content="Parcours personnalisé de piano, suivi mois par mois, semaine par semaine et séance par séance.">
<style>:root {
  --navy-950: #10283c;
  --navy-900: #17324d;
  --navy-800: #1f4d78;
  --blue-600: #2e74b5;
  --blue-100: #e8eef5;
  --blue-50: #f4f7fa;
  --gold-500: #c8952d;
  --gold-100: #fff4dc;
  --green-700: #2f6b4f;
  --green-100: #eaf5ee;
  --ink: #20252a;
  --muted: #64717e;
  --line: #dce3e9;
  --paper: #ffffff;
  --canvas: #eef2f5;
  --shadow: 0 18px 50px rgba(23, 50, 77, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--canvas);
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family:
    Inter, "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(46, 116, 181, 0.25);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 30px 22px;
  background: var(--navy-950);
  color: white;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 7px 30px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--gold-500);
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 29px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 15px;
  letter-spacing: 0.01em;
}

.brand small {
  margin-top: 2px;
  color: #aab9c6;
  font-size: 11px;
}

.sidebar nav {
  display: grid;
  gap: 6px;
}

.nav-item {
  width: 100%;
  padding: 12px 14px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #c3ced8;
  text-align: left;
  cursor: pointer;
  transition:
    background 150ms ease,
    color 150ms ease,
    transform 150ms ease;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.07);
  color: white;
  transform: translateX(2px);
}

.nav-item.is-active {
  background: #234d70;
  color: white;
  box-shadow: inset 3px 0 0 var(--gold-500);
}

.nav-item span,
.nav-item small {
  display: block;
}

.nav-item span {
  font-size: 14px;
  font-weight: 700;
}

.nav-item small {
  margin-top: 2px;
  color: #91a5b7;
  font-size: 10px;
}

.nav-item.is-active small {
  color: #bfd0df;
}

.sidebar-note {
  margin-top: auto;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.055);
}

.sidebar-note p {
  margin: 8px 0 0;
  color: #becbd6;
  font-size: 11px;
  line-height: 1.55;
}

.main {
  min-width: 0;
  padding: 30px 38px 52px;
}

.topbar {
  max-width: 1380px;
  margin: 0 auto 24px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.topbar h1 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(28px, 3vw, 43px);
  font-weight: 500;
  letter-spacing: -0.025em;
}

.eyebrow {
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: var(--navy-900);
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.button {
  min-height: 40px;
  padding: 9px 16px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 750;
  cursor: pointer;
  transition:
    transform 140ms ease,
    box-shadow 140ms ease,
    background 140ms ease;
}

.button:hover {
  transform: translateY(-1px);
}

.button--primary {
  background: var(--blue-600);
  color: white;
  box-shadow: 0 9px 22px rgba(46, 116, 181, 0.24);
}

.button--primary:hover {
  background: #27679f;
}

.button--quiet {
  border-color: var(--line);
  background: white;
  color: var(--navy-800);
}

.button--ghost {
  border-color: rgba(255, 255, 255, 0.34);
  background: transparent;
  color: white;
}

.page-stack {
  max-width: 1380px;
  margin: 0 auto;
  display: grid;
  gap: 20px;
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(250px, 0.9fr);
  gap: 20px;
}

.hero-card,
.status-card,
.content-card {
  border: 1px solid rgba(23, 50, 77, 0.08);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.hero-card {
  min-height: 318px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  overflow: hidden;
  background:
    radial-gradient(circle at 85% 15%, rgba(200, 149, 45, 0.18), transparent 28%),
    linear-gradient(140deg, var(--navy-950), #1d4d70);
  color: white;
}

.hero-copy {
  padding: 36px 0 34px 38px;
}

.pill {
  display: inline-flex;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.pill--gold {
  background: var(--gold-100);
  color: #7c5912;
}

.unit-kicker {
  margin: 20px 0 5px;
  color: #aebfce;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.hero-card h2 {
  max-width: 620px;
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(29px, 3.4vw, 48px);
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -0.025em;
}

.hero-objective {
  max-width: 660px;
  margin: 16px 0 0;
  color: #d9e2e9;
  font-size: 13px;
  line-height: 1.65;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 24px;
}

.hero-progress {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.progress-ring {
  width: 142px;
  height: 142px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(
    var(--gold-500) var(--progress-deg, 0deg),
    rgba(255, 255, 255, 0.13) 0deg
  );
  position: relative;
}

.progress-ring::after {
  position: absolute;
  width: 116px;
  height: 116px;
  border-radius: 50%;
  background: #173d59;
  content: "";
}

.progress-ring div {
  position: relative;
  z-index: 1;
}

.progress-ring strong,
.progress-ring span {
  display: block;
}

.progress-ring strong {
  font-family: Georgia, serif;
  font-size: 32px;
}

.progress-ring span {
  color: #b7c6d2;
  font-size: 10px;
}

.hero-progress p {
  margin: 15px 0 3px;
  font-size: 12px;
  font-weight: 800;
}

.hero-progress small {
  max-width: 160px;
  color: #aebfce;
  font-size: 9px;
  line-height: 1.4;
}

.status-card {
  padding: 27px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.status-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.status-dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--green-700);
  font-size: 9px;
  font-weight: 800;
}

.status-dot::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #55a174;
  content: "";
}

.big-number {
  margin-top: 22px;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 57px;
  font-weight: 500;
  line-height: 0.9;
}

.big-label {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;
}

.mini-stat-row {
  margin-top: 30px;
  padding-top: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  border-top: 1px solid var(--line);
}

.mini-stat-row div {
  display: grid;
  gap: 2px;
}

.mini-stat-row strong {
  color: var(--navy-800);
  font-size: 17px;
}

.mini-stat-row span {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.section-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, 0.8fr);
  gap: 20px;
}

.content-card {
  padding: 26px;
}

.card-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.card-heading h3,
.anchor-card h3 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.week-badge {
  min-width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--blue-100);
  color: var(--navy-800);
  font-size: 12px;
  font-weight: 850;
}

.details-grid {
  margin-top: 21px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-field {
  padding: 15px 16px;
  border-left: 3px solid var(--blue-600);
  border-radius: 8px;
  background: var(--blue-50);
}

.detail-field--gold {
  border-left-color: var(--gold-500);
  background: #fffaf0;
}

.detail-field--green {
  border-left-color: var(--green-700);
  background: var(--green-100);
}

.detail-field span {
  color: var(--navy-800);
  font-size: 9px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.detail-field p {
  margin: 5px 0 0;
  color: #48545e;
  font-size: 11px;
  line-height: 1.55;
}

.anchor-card {
  background: #fffaf0;
}

.anchor-card p {
  margin: 15px 0 0;
  color: #56616a;
  font-size: 12px;
  line-height: 1.65;
}

.anchor-line {
  margin-top: 22px;
  padding-top: 18px;
  display: grid;
  gap: 4px;
  border-top: 1px solid #eadab6;
}

.anchor-line span {
  color: #8b7550;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.anchor-line strong {
  color: #71541a;
  font-size: 12px;
}

.text-button {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--blue-600);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.phase-strip {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(6, minmax(125px, 1fr));
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.phase-tile {
  min-height: 124px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fbfcfd;
}

.phase-tile.is-current {
  border-color: #9ebdd7;
  background: var(--blue-100);
}

.phase-tile span {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.phase-tile strong {
  margin-top: 9px;
  color: var(--navy-950);
  font-size: 11px;
  line-height: 1.35;
}

.phase-tile small {
  margin-top: auto;
  padding-top: 10px;
  color: var(--muted);
  font-size: 9px;
}

.placeholder {
  max-width: 800px;
  margin: 80px auto 0;
  padding: 56px;
  text-align: center;
}

.placeholder h2 {
  margin: 8px 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 500;
}

.placeholder p {
  max-width: 520px;
  margin: 0 auto 24px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.mobile-nav {
  display: none;
}

@media (max-width: 1080px) {
  .app-shell {
    grid-template-columns: 210px minmax(0, 1fr);
  }

  .sidebar {
    padding-inline: 16px;
  }

  .main {
    padding-inline: 24px;
  }

  .hero-grid,
  .section-grid {
    grid-template-columns: 1fr;
  }

  .status-card {
    display: grid;
    grid-template-columns: auto auto 1fr;
    column-gap: 22px;
  }

  .status-heading {
    grid-column: 1 / -1;
  }

  .big-number {
    margin-top: 18px;
  }

  .big-label {
    align-self: end;
    margin-bottom: 5px;
  }

  .mini-stat-row {
    margin: 16px 0 0;
    padding: 0 0 0 22px;
    align-self: center;
    border-top: 0;
    border-left: 1px solid var(--line);
  }
}

@media (max-width: 760px) {
  .app-shell {
    display: block;
  }

  .sidebar {
    display: none;
  }

  .main {
    padding: 22px 16px 88px;
  }

  .topbar {
    align-items: center;
  }

  .topbar h1 {
    font-size: 27px;
  }

  .top-actions .button {
    display: none;
  }

  .mobile-nav {
    position: sticky;
    top: 8px;
    z-index: 20;
    margin: 0 -4px 18px;
    padding: 5px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 10px 28px rgba(23, 50, 77, 0.1);
    backdrop-filter: blur(12px);
  }

  .mobile-nav button {
    flex: 0 0 auto;
    padding: 8px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-weight: 750;
  }

  .mobile-nav button.is-active {
    background: var(--navy-900);
    color: white;
  }

  .hero-card {
    min-height: 0;
    grid-template-columns: 1fr;
  }

  .hero-copy {
    padding: 28px 24px 20px;
  }

  .hero-card h2 {
    font-size: 35px;
  }

  .hero-progress {
    padding: 16px 24px 27px;
    flex-direction: row;
    justify-content: flex-start;
    gap: 14px;
    text-align: left;
  }

  .progress-ring {
    width: 82px;
    height: 82px;
    flex: 0 0 auto;
  }

  .progress-ring::after {
    width: 66px;
    height: 66px;
  }

  .progress-ring strong {
    font-size: 21px;
  }

  .hero-progress p,
  .hero-progress small {
    margin: 0;
  }

  .status-card {
    display: flex;
  }

  .mini-stat-row {
    margin-top: 24px;
    padding: 18px 0 0;
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  .details-grid {
    grid-template-columns: 1fr;
  }

  .content-card {
    padding: 21px;
  }

  .card-heading {
    align-items: center;
  }

  .card-heading .text-button {
    display: none;
  }

  .phase-strip {
    grid-template-columns: repeat(6, 142px);
  }
}

@media print {
  .sidebar,
  .mobile-nav,
  .top-actions,
  .hero-actions {
    display: none !important;
  }

  .app-shell {
    display: block;
  }

  .main {
    padding: 0;
  }

  .hero-card,
  .status-card,
  .content-card {
    break-inside: avoid;
    box-shadow: none;
  }
}

/* Suivi, parcours et journal */

.save-state {
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
}

.sidebar-progress {
  margin-top: 24px;
  padding: 16px;
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
}

.sidebar-progress > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sidebar-progress span {
  color: #b7c5d1;
  font-size: 9px;
  font-weight: 750;
}

.sidebar-progress strong {
  color: white;
  font-size: 13px;
}

.sidebar-progress small {
  display: block;
  margin-top: 7px;
  color: #8fa3b4;
  font-size: 8px;
}

.linear-progress {
  width: 100%;
  height: 5px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(142, 161, 176, 0.22);
}

.linear-progress span {
  height: 100%;
  display: block;
  border-radius: inherit;
  background: var(--gold-500);
  transition: width 240ms ease;
}

.phase-tile .linear-progress {
  margin-top: 8px;
}

.phase-tile .linear-progress span {
  background: var(--blue-600);
}

.status-badge {
  display: inline-flex;
  width: max-content;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.035em;
  white-space: nowrap;
}

.status-badge::before {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  content: "";
}

.status-badge--not_started {
  background: #edf1f4;
  color: #64717e;
}

.status-badge--not_started::before {
  background: #9aa7b1;
}

.status-badge--in_progress {
  background: var(--gold-100);
  color: #795715;
}

.status-badge--in_progress::before {
  background: var(--gold-500);
}

.status-badge--mastered {
  background: var(--green-100);
  color: var(--green-700);
}

.status-badge--mastered::before {
  background: #4c956b;
}

.status-badge--paused {
  background: #f6eaea;
  color: #8d4444;
}

.status-badge--paused::before {
  background: #ad5e5e;
}

.button--success {
  background: var(--green-700);
  color: white;
}

.button--danger {
  border-color: #efcaca;
  background: #fff3f3;
  color: #963f3f;
}

.session-mini-grid {
  margin-top: 22px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 11px;
}

.session-mini,
.unit-session {
  min-width: 0;
  padding: 14px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fbfcfd;
}

.session-mini.is-complete,
.unit-session.is-complete {
  border-color: #b9d7c5;
  background: var(--green-100);
}

.session-check {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border: 1px solid #b4c6d4;
  border-radius: 8px;
  background: white;
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 900;
  cursor: pointer;
}

.is-complete .session-check {
  border-color: #6ba284;
  background: var(--green-700);
  color: white;
}

.session-mini div,
.unit-session div {
  min-width: 0;
}

.session-mini div > span,
.unit-session div > span {
  display: block;
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
}

.session-mini div > strong,
.unit-session div > strong {
  display: block;
  margin-top: 4px;
  color: var(--navy-950);
  font-size: 11px;
  line-height: 1.35;
}

.session-mini div > small,
.unit-session div > small {
  display: -webkit-box;
  margin-top: 5px;
  overflow: hidden;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.mini-edit {
  grid-column: 2;
  justify-self: start;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--blue-600);
  font-size: 9px;
  font-weight: 800;
  cursor: pointer;
}

.validation-banner {
  margin-top: 16px;
  padding: 15px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid #b8d9c5;
  border-radius: 12px;
  background: var(--green-100);
}

.validation-banner strong,
.validation-banner span {
  display: block;
}

.validation-banner strong {
  color: var(--green-700);
  font-size: 11px;
}

.validation-banner span {
  margin-top: 3px;
  color: #54705f;
  font-size: 9px;
}

.view-intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  background:
    linear-gradient(110deg, rgba(232, 238, 245, 0.76), rgba(255, 255, 255, 0.9)),
    white;
}

.view-intro h2,
.month-navigator h2,
.reference-hero h2,
.final-outcome h2 {
  margin: 6px 0 0;
  color: var(--navy-950);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(27px, 3vw, 39px);
  font-weight: 500;
  letter-spacing: -0.02em;
}

.view-intro p,
.month-navigator > p,
.reference-hero > div > p,
.section-lead {
  max-width: 740px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.intro-stat {
  min-width: 150px;
  padding-left: 24px;
  display: grid;
  border-left: 1px solid var(--line);
}

.intro-stat strong {
  color: var(--navy-800);
  font-family: Georgia, serif;
  font-size: 38px;
  font-weight: 500;
}

.intro-stat span {
  color: var(--muted);
  font-size: 9px;
}

.filter-bar {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 190px 170px auto;
  align-items: end;
  gap: 11px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.82);
}

.filter-bar--sessions {
  grid-template-columns: minmax(240px, 1.2fr) 180px minmax(210px, 1fr) auto;
}

.filter-bar label,
.unit-toolbar label,
.editor-form label,
.review-notes,
.settings-date {
  display: grid;
  gap: 6px;
}

.filter-bar label > span,
.unit-toolbar label > span,
.editor-form label > span,
.review-notes > span,
.settings-date > span {
  color: var(--navy-800);
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.075em;
  text-transform: uppercase;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid #cad5de;
  border-radius: 9px;
  background: white;
  color: var(--ink);
}

input,
select {
  min-height: 39px;
  padding: 8px 10px;
  font-size: 11px;
}

textarea {
  padding: 10px 11px;
  font-size: 11px;
  line-height: 1.55;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: #9ba6af;
}

.result-count {
  min-height: 39px;
  padding: 11px 3px 0;
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  white-space: nowrap;
}

.unit-list {
  display: grid;
  gap: 9px;
}

.unit-card {
  scroll-margin-top: 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
  box-shadow: 0 8px 28px rgba(23, 50, 77, 0.035);
}

.unit-card.is-open {
  border-color: #a9c4d9;
  box-shadow: var(--shadow);
}

.unit-open {
  width: 100%;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) 88px 92px 24px;
  align-items: center;
  gap: 12px;
  border: 0;
  background: white;
  text-align: left;
  cursor: pointer;
}

.unit-open:hover {
  background: var(--blue-50);
}

.unit-card.is-open .unit-open {
  background: var(--blue-100);
}

.unit-number {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: var(--navy-900);
  color: white;
  font-size: 10px;
  font-weight: 900;
}

.unit-title-block {
  min-width: 0;
}

.unit-title-block small,
.unit-title-block strong {
  display: block;
}

.unit-title-block small {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.unit-title-block strong {
  margin-top: 4px;
  overflow: hidden;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 16px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.unit-session-progress {
  color: var(--muted);
  font-size: 9px;
  font-weight: 750;
  text-align: right;
}

.chevron {
  color: var(--blue-600);
  font-size: 20px;
  text-align: center;
}

.unit-detail {
  padding: 0 20px 22px;
  border-top: 1px solid #cad9e4;
  background: #fbfcfd;
}

.unit-toolbar {
  padding: 14px 0;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
}

.unit-toolbar label {
  width: 190px;
}

.details-grid--unit {
  margin-top: 2px;
}

.tim-callout {
  margin-top: 12px;
  padding: 13px 15px;
  border: 1px dashed #d4bd88;
  border-radius: 10px;
  background: #fffaf0;
}

.tim-callout span {
  color: #80611d;
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.tim-callout p {
  margin: 4px 0 0;
  color: #66583d;
  font-size: 10px;
  line-height: 1.5;
}

.unit-session-grid {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 9px;
}

.unit-session {
  padding: 11px;
}

.empty-state {
  display: grid;
  place-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

/* Vue mensuelle */

.month-navigator {
  overflow: hidden;
}

.month-tabs {
  margin: 22px -26px -26px;
  padding: 14px 26px 18px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  border-top: 1px solid var(--line);
  background: var(--blue-50);
}

.month-tabs button {
  min-width: 105px;
  padding: 10px;
  display: grid;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  text-align: left;
  cursor: pointer;
}

.month-tabs button.is-active {
  border-color: var(--blue-600);
  background: var(--navy-900);
  color: white;
}

.month-tabs span {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
}

.month-tabs button.is-active span {
  color: #9fc6e5;
}

.month-tabs strong {
  font-size: 11px;
}

.month-tabs small {
  color: var(--muted);
  font-size: 7px;
}

.month-tabs button.is-active small {
  color: #b8c8d5;
}

.calendar-weeks {
  display: grid;
  gap: 13px;
}

.calendar-week {
  padding: 22px;
}

.calendar-week-heading {
  display: grid;
  grid-template-columns: 105px minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
}

.calendar-date {
  padding-right: 15px;
  display: grid;
  border-right: 1px solid var(--line);
}

.calendar-date span,
.calendar-week-heading small {
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
}

.calendar-date strong {
  margin-top: 3px;
  color: var(--navy-800);
  font-size: 11px;
}

.calendar-week-heading h3 {
  margin: 3px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: 500;
}

.calendar-status {
  display: grid;
  justify-items: end;
  gap: 5px;
}

.calendar-status > span {
  color: var(--muted);
  font-size: 8px;
}

.calendar-objective {
  margin: 14px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
}

.calendar-session-row {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.calendar-session {
  padding: 9px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fbfcfd;
}

.calendar-session.is-complete {
  border-color: #b9d7c5;
  background: var(--green-100);
}

.calendar-session-open {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.calendar-session-open span,
.calendar-session-open strong {
  display: block;
}

.calendar-session-open span {
  color: var(--blue-600);
  font-size: 7px;
  font-weight: 800;
}

.calendar-session-open strong {
  margin-top: 2px;
  overflow: hidden;
  color: var(--navy-950);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calendar-actions {
  margin-top: 13px;
  display: flex;
  justify-content: space-between;
  gap: 14px;
}

.monthly-review-summary {
  display: grid;
  grid-template-columns: minmax(210px, 0.8fr) minmax(300px, 1.4fr) auto;
  align-items: center;
  gap: 24px;
  background: #fffaf0;
}

.monthly-review-summary h3 {
  margin: 5px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.monthly-review-summary p {
  color: #6a604d;
  font-size: 10px;
  line-height: 1.6;
}

/* Journal des séances */

.session-list {
  display: grid;
  gap: 9px;
}

.session-row {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: auto 120px minmax(240px, 1fr) 170px auto;
  align-items: center;
  gap: 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  box-shadow: 0 8px 25px rgba(23, 50, 77, 0.035);
}

.session-row.is-complete {
  border-color: #b9d7c5;
  background: linear-gradient(90deg, var(--green-100), white 35%);
}

.session-check--large {
  width: 36px;
  height: 36px;
  font-size: 11px;
}

.session-row-date {
  display: grid;
  gap: 3px;
}

.session-row-date span {
  color: var(--navy-800);
  font-size: 9px;
  font-weight: 800;
}

.session-row-date small {
  color: var(--muted);
  font-size: 8px;
}

.session-row-main {
  min-width: 0;
}

.session-row-main > span {
  display: block;
  overflow: hidden;
  color: var(--blue-600);
  font-size: 8px;
  font-weight: 800;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

.session-row-main > strong {
  display: block;
  margin-top: 2px;
  color: var(--navy-950);
  font-size: 12px;
}

.session-row-main > p {
  margin: 3px 0 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-preview {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  color: #876b2b;
  font-size: 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.session-row-meta {
  display: grid;
  justify-items: start;
  gap: 5px;
  color: var(--muted);
  font-size: 8px;
}

.saved-chip {
  padding: 3px 6px;
  border-radius: 999px;
  background: var(--blue-100);
  color: var(--blue-600);
  font-weight: 800;
}

.load-more {
  min-height: 48px;
  border: 1px dashed #9fb9cd;
  border-radius: 12px;
  background: var(--blue-50);
  color: var(--blue-600);
  font-size: 10px;
  font-weight: 850;
  cursor: pointer;
}

/* Référentiel */

.reference-stack h3 {
  margin: 6px 0 0;
  color: var(--navy-950);
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 500;
}

.reference-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.8fr);
  gap: 28px;
  background:
    radial-gradient(circle at 92% 10%, rgba(200, 149, 45, 0.17), transparent 32%),
    white;
}

.reference-decision {
  padding: 22px;
  border-radius: 14px;
  background: var(--green-100);
}

.reference-decision strong {
  color: var(--green-700);
  font-size: 11px;
}

.reference-decision p {
  margin: 8px 0 0;
  color: #526b5c;
  font-size: 10px;
  line-height: 1.65;
}

.profile-table {
  margin-top: 20px;
  display: grid;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.profile-table article {
  display: grid;
  grid-template-columns: 150px 1fr 1.25fr;
  gap: 18px;
  padding: 13px 15px;
}

.profile-table article:nth-child(even) {
  background: var(--blue-50);
}

.profile-table strong {
  color: var(--navy-800);
  font-size: 10px;
}

.profile-table p {
  margin: 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.reference-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.clean-list {
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  gap: 10px;
  list-style: none;
  counter-reset: guide-list;
}

ol.clean-list li {
  counter-increment: guide-list;
}

.clean-list li {
  position: relative;
  padding-left: 28px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.55;
}

.clean-list li::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: var(--blue-100);
  color: var(--blue-600);
  content: "•";
  font-size: 11px;
  font-weight: 900;
}

ol.clean-list li::before {
  content: counter(guide-list);
  font-size: 8px;
}

.soft-callout {
  margin: 18px 0 0;
  padding: 12px 13px;
  border-left: 3px solid var(--gold-500);
  border-radius: 7px;
  background: #fffaf0;
  color: #746344;
  font-size: 9px;
  line-height: 1.55;
}

.jazz-prep-grid {
  margin-top: 19px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.jazz-prep-grid article {
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--blue-50);
}

.jazz-prep-grid strong {
  color: var(--navy-800);
  font-size: 10px;
}

.jazz-prep-grid p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.rule-grid {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.rule-grid article {
  padding: 13px;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.rule-grid article > span {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--navy-900);
  color: white;
  font-size: 9px;
  font-weight: 850;
}

.rule-grid strong {
  color: var(--navy-800);
  font-size: 10px;
}

.rule-grid p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
}

.fallback-ladder {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.fallback-ladder article {
  min-height: 74px;
  padding: 12px;
  display: grid;
  grid-template-columns: 23px 1fr;
  align-items: start;
  gap: 8px;
  border-radius: 10px;
  background: var(--blue-50);
}

.fallback-ladder span {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gold-500);
  color: var(--navy-950);
  font-size: 8px;
  font-weight: 900;
}

.fallback-ladder p {
  margin: 2px 0 0;
  color: var(--navy-800);
  font-size: 9px;
  line-height: 1.45;
}

.missing-step-table {
  margin-top: 20px;
  display: grid;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}

.missing-step-table article {
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 190px 1fr 1fr;
  gap: 16px;
}

.missing-step-table article:nth-child(even) {
  background: var(--blue-50);
}

.missing-step-table strong {
  color: var(--navy-800);
  font-size: 9px;
}

.missing-step-table p {
  margin: 0;
  color: var(--muted);
  font-size: 8.5px;
  line-height: 1.5;
}

.reference-search {
  max-width: 420px;
  margin-top: 18px;
  display: grid;
  gap: 6px;
}

.reference-search > span {
  color: var(--navy-800);
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
}

.reference-unit-list {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.reference-unit {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.reference-unit > button {
  width: 100%;
  padding: 10px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 9px;
  border: 0;
  background: white;
  text-align: left;
  cursor: pointer;
}

.reference-unit.is-open > button {
  background: var(--blue-100);
}

.reference-unit > button span {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--navy-900);
  color: white;
  font-size: 8px;
  font-weight: 850;
}

.reference-unit > button strong {
  overflow: hidden;
  color: var(--navy-950);
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reference-unit > button small {
  max-width: 140px;
  overflow: hidden;
  color: var(--muted);
  font-size: 7px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reference-unit > button b {
  color: var(--blue-600);
  font-size: 16px;
}

.reference-unit > div {
  padding: 10px;
  display: grid;
  gap: 7px;
  background: #fbfcfd;
}

.reference-unit .detail-field {
  padding: 10px;
}

.deferred-list {
  margin-top: 18px;
  display: grid;
  gap: 9px;
}

.deferred-list article {
  padding: 12px;
  border-left: 3px solid var(--gold-500);
  border-radius: 8px;
  background: #fffaf0;
}

.deferred-list strong {
  color: #71541a;
  font-size: 9px;
}

.deferred-list p {
  margin: 5px 0 0;
  color: #746344;
  font-size: 9px;
  line-height: 1.55;
}

.final-outcome {
  padding: 36px;
  border-radius: 20px;
  background:
    radial-gradient(circle at 90% 20%, rgba(200, 149, 45, 0.2), transparent 30%),
    var(--navy-950);
  color: white;
}

.final-outcome .eyebrow {
  color: #e8c36f;
}

.final-outcome h2 {
  max-width: 900px;
  color: white;
}

.final-outcome p {
  max-width: 880px;
  margin: 15px 0 0;
  color: #c6d2dc;
  font-size: 11px;
  line-height: 1.7;
}

/* Éditeurs et sauvegarde */

.drawer-layer,
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  justify-items: end;
}

.modal-layer {
  place-items: center;
}

.drawer-scrim {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: rgba(9, 27, 42, 0.58);
  backdrop-filter: blur(3px);
  cursor: pointer;
}

.drawer {
  position: relative;
  z-index: 1;
  width: min(680px, 94vw);
  height: 100vh;
  padding: 27px 30px 42px;
  overflow-y: auto;
  background: white;
  box-shadow: -20px 0 60px rgba(10, 30, 47, 0.22);
  animation: drawer-in 180ms ease-out;
}

@keyframes drawer-in {
  from {
    transform: translateX(30px);
    opacity: 0;
  }
}

.drawer-heading {
  display: flex;
  align-items: flex-start;

function phaseForWeek(number) {
    return phases.find((phase) => {
        const [start, end] = phase.weeks
            .split("à")
            .map((part) => Number(part.trim()));
        return number >= start && number <= end;
    });
}
const routeUnits = [{"kind":"bridge","id":"P1","number":1,"title":"Sécuriser la fin de grille G → C","objective":"Faire de la jonction entre la fin d’un chorus et le début du suivant un repère moteur solide.","work":"Main gauche seule en R-3-5-3, sur une boucle de quatre mesures reproduisant la fin et le début de ta grille — souvent C7 | G7 | C7 | C7. Dire « I – V – I – I » puis compter les mesures.","ear":"Écouter l’arrivée sur Do. Il n’est pas demandé de chanter toute la basse : dire ou fredonner seulement « Sol → Do » au moment de la résolution suffit.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Dix passages consécutifs sans perte de pulsation, puis trois grilles complètes dont la jonction G → C reste stable.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":1},{"kind":"bridge","id":"P2","number":2,"title":"Noires préparées à droite sur un seul accord","objective":"Habituer la main gauche à continuer pendant quatre attaques régulières de la main droite, sans ajouter de décision mélodique.","work":"Sur C7 seulement, garder R-3-5-3 à gauche. À droite, jouer quatre Do en noires, puis une mesure de silence. Alterner « une mesure jouée / une mesure silencieuse ». Tout est préparé.","ear":"Avant chaque mesure jouée, entendre mentalement le premier Do. L’audition intérieure commence par une seule note, pas par une phrase entière.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Huit alternances sans rupture de la main gauche, sur deux jours différents.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":2},{"kind":"bridge","id":"P3","number":3,"title":"Noires préparées sur toute la grille","objective":"Stabiliser la coordination avec les fondamentales I, IV et V à la main droite.","work":"Main gauche R-3-5-3. Main droite : quatre noires sur la fondamentale de l’accord courant. Isoler d’abord les deux mesures autour de G → C, puis jouer la grille entière. Ne rien improviser.","ear":"Dire le nom de la prochaine fondamentale pendant la mesure précédente : « Do », « Fa » ou « Sol ». Cette anticipation verbale prépare l’anticipation auditive.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Trois grilles sans perte. Une récupération à la mesure suivante reste un acquis précieux, mais ne compte pas comme grille entièrement stable pour cette validation.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":3},{"kind":"bridge","id":"P4","number":4,"title":"Noires et silences planifiés","objective":"Faire survivre la main gauche aux entrées et sorties de la main droite, sans improvisation libre.","work":"Patron A = quatre noires ; patron B = blanche puis deux temps de silence. Sur la grille, alterner A / silence / B / silence. Main gauche R-3-5-3 inchangée.","ear":"Continuer à sentir quatre temps pendant les silences et anticiper la prochaine entrée.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Deux chorus avec les patrons prévus, puis un troisième en inversant A et B sans désorganiser la basse.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":4},{"kind":"bridge","id":"P5","number":5,"title":"Construire trois mots rythmiques","objective":"Créer le premier vocabulaire sans la charge de la main gauche.","work":"Configuration : playback seul, main gauche silencieuse. Main droite : Do médium uniquement. Apprendre trois cellules d'une mesure, sans croches : A = Do noire sur 1, silence sur 2, Do noire sur 3, silence sur 4 ; B = Do blanche sur 1-2, silence sur 3-4 ; C = silence sur 1, Do noire sur 2, silence sur 3, Do noire sur 4. Pour chaque cellule : la dire avec « ta », la jouer deux fois à l'identique, faire une mesure entière de silence, puis la rejouer. Terminer par trois cycles cellule - répétition - silence, un avec chaque cellule.","ear":"Vocaliser avec « ta » et des silences. La hauteur chantée est indifférente ; le rythme doit être précis.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Le lendemain, rejouer A, B et C de mémoire dans un ordre différent, deux fois chacune, sans déplacer d'attaque. Valider lorsque les trois cellules sont reconnues et reproduites correctement lors de trois passages répartis sur au moins deux jours.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":5},{"kind":"bridge","id":"P6","number":6,"title":"Deux notes en question-réponse","objective":"Transformer les mots rythmiques en premières phrases mémorisables.","work":"Configuration : playback seul, main gauche silencieuse. Main droite : Do et Mi bémol uniquement. Travailler par cycles de quatre mesures : mesure 1 = question de 2 à 4 attaques ; mesure 2 = silence complet ; mesure 3 = réponse de 2 à 4 attaques qui finit sur Do ; mesure 4 = silence complet. Réutiliser les trois rythmes de P5. Une fois sur deux, vocaliser le rythme et la dernière note de la réponse avant de la jouer.","ear":"Écouter une phrase, vocaliser son rythme puis retrouver les deux notes. Chanter juste est secondaire ; reconnaître la direction et la note finale suffit.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Produire trois cycles question-silence-réponse-silence différents dans un chorus de 12 mesures, puis répéter exactement l'un des trois couples après trente secondes. Réussir cette tâche trois fois sur au moins deux jours.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":6},{"kind":"bridge","id":"P7","number":7,"title":"Trois notes, motifs et respiration","objective":"Installer un vocabulaire minimal suffisamment riche avant de réunir les mains.","work":"Configuration : playback seul, main gauche silencieuse. Main droite : Do, Mi bémol et Fa. Apprendre trois motifs d'une mesure : A = Do noire sur 1, Mi bémol noire sur 2, Fa blanche sur 3-4 ; B = Fa noire sur 1, Mi bémol noire sur 2, Do blanche sur 3-4 ; C = Do blanche sur 1-2, Fa noire sur 3, Mi bémol noire sur 4. Jouer d'abord chaque motif deux fois à l'identique. Puis faire un chorus en alternant une mesure jouée / une mesure silencieuse ; refaire un chorus en alternant deux mesures jouées / deux mesures silencieuses.","ear":"Entendre d’abord la dernière note du motif. Comparer ensuite répétition exacte et variation.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Deux chorus continus : le premier avec alternance 1 mesure jouée / 1 mesure silencieuse, le second avec alternance 2 / 2. Dans chaque chorus, faire entendre au moins un motif répété à l'identique avant toute variation et ne jamais remplir les mesures de silence prévues.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":7},{"kind":"bridge","id":"P8","number":8,"title":"Quatre puis cinq notes sans réciter une gamme","objective":"Élargir le réservoir sonore tout en conservant des motifs courts et contrôlables.","work":"Configuration : playback seul, main gauche silencieuse. Main droite : commencer avec Do-Mi bémol-Fa-Sol ; après un chorus stable, ajouter Si bémol. Construire uniquement des groupes de 2 ou 3 notes, avec au moins une mesure entière de silence par bloc de quatre mesures. Une phrase sur deux doit être préparée en entendant mentalement sa première ou sa dernière note. Après deux chorus stables à cinq notes, Sol bémol peut apparaître une seule fois dans un chorus, uniquement entre Fa et Sol et jamais comme note finale.","ear":"Avant une phrase sur deux, entendre uniquement sa première ou sa dernière note. Pour varier, changer le rythme ou la dernière note, jamais les deux simultanément.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Réaliser deux chorus à cinq notes contenant chacun au moins trois séquences motif - répétition - variation - silence, sans montée ou descente continue de toute la pentatonique. La validation est obtenue après trois prises satisfaisantes sur au moins deux jours.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":8},{"kind":"bridge","id":"P9","number":9,"title":"Checkpoint main droite seule","objective":"Vérifier que vocabulaire, forme, respiration et mémoire sont disponibles avant de charger la main gauche.","work":"Configuration : playback seul, main gauche silencieuse. Enregistrer trois chorus successifs de 12 mesures : chorus 1 avec Do uniquement ; chorus 2 avec Do-Mi bémol-Fa ; chorus 3 avec Do-Mi bémol-Fa-Sol-Si bémol, Sol bémol restant facultatif comme note de passage. Dans chaque chorus, imposer au moins trois mesures entièrement silencieuses et au moins une idée répétée à l'identique avant variation.","ear":"Avant chaque chorus, choisir mentalement la première ou la dernière note. Après l’enregistrement, repérer les phrases que tu pourrais reproduire.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Évaluer cinq critères : 1) pulsation continue sans arrêt ni accélération perceptible ; 2) forme conservée avec repères corrects aux mesures 1, 5 et 9 et reprise de grille ; 3) au moins trois mesures entières de silence ; 4) au moins un motif reconnaissable répété ; 5) conclusion volontaire sur Do dans les deux dernières mesures. Un essai est réussi avec au moins 4 critères sur 5. Obtenir trois essais réussis répartis sur au moins deux jours.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":9},{"kind":"standard","id":"CJ1","number":1,"title":"C Jam Blues · passage 1 — Reconnaître le thème et les trois blocs de quatre mesures","objective":"Installer C Jam Blues dans la mémoire auditive sans ajouter de difficulté instrumentale.","work":"Choisir une seule version de référence. Écouter le thème d’entrée, suivre les mesures 1–4, 5–8 et 9–12 avec trois cartes, puis repérer le début du premier solo et le retour final du thème. Le piano reste fermé lors des deux premières écoutes.","ear":"Reconnaître la cellule à deux notes et anticiper son retour. Il suffit d’en fredonner le rythme ou la dernière note ve":"Transformer les basses et accords appris en outils de régulation de la difficulté.","work":"Configuration : quatre chorus séparés, sans changer la main droite. Main droite : utiliser le patron préparé de P16 aux mesures 1-2, 5-6 et 9-10, avec silences 3-4, 7-8 et 11-12. Jouer ce même contenu successivement avec : 1) fondamentales en rondes ; 2) fondamentale-quinte tenue au temps 1 ; 3) basse alternée fondamentale au temps 1 / quinte au temps 3 ; 4) accords-coquilles au temps 1. Après chaque chorus, noter continuité de la pulsation, précision de la phrase droite et charge d'attention ressentie.","ear":"Identifier l’accompagnement qui laisse le plus de disponibilité pour entendre la phrase droite.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Choisir un accompagnement principal et un accompagnement de repli. Le choix est validé si chacun permet deux chorus continus sans perte de forme et si la phrase droite reste rythmiquement identique au modèle de P16.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":20},{"kind":"standard","id":"CJ4","number":4,"title":"C Jam Blues · passage 2 — Tenir la grille de C Jam Blues à la main gauche seule","objective":"Séparer la maîtrise harmonique de la mélodie et choisir un accompagnement de repli réellement stable.","work":"Jouer trois chorus avec fondamentales en rondes. Refaire avec fondamentale–quinte tenue ou basse alternée seulement si les changements restent anticipés. Ne pas employer R-3-5-3 pour cette première validation.","ear":"Dire I, IV ou V avant chaque changement et écouter particulièrement la résolution G → C entre deux chorus.","tim":"Application des accompagnements P10–P17 à la grille du premier standard.","validation":"Trois chorus main gauche seule sans hésitation tardive ; identifier l’accompagnement principal et celui de repli.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":21},{"kind":"standard","id":"CJ5","number":5,"title":"C Jam Blues · passage 2 — Réunir le thème et une main gauche raréfiée","objective":"Jouer la mélodie sans perdre son rythme lorsque la main gauche intervient très peu.","work":"Étape A : thème avec playback, main gauche silencieuse. Étape B : une fondamentale au temps 1 toutes les deux mesures. Étape C : une fondamentale au temps 1 de chaque mesure. Ne pas passer à l’étape suivante si le thème se modifie.","ear":"Écouter mentalement le début de chaque cellule de thème pendant la tenue de la note grave.","tim":"Le thème reste la tâche nouvelle ; la main gauche reprend une figure plus simple que le niveau moteur déjà atteint.","validation":"Deux thèmes complets à l’étape la plus haute qui conserve exactement rythme, silences et reprise de grille.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":22},{"kind":"standard","id":"CJ6","number":6,"title":"C Jam Blues · passage 2 — Premier chorus à une note sur C Jam Blues","objective":"Utiliser le standard comme cadre d’improvisation sans remettre immédiatement les deux mains en compétition.","work":"Improviser d’abord avec Do uniquement sur playback : phrases de deux mesures maximum et une mesure vide sur quatre. Refaire ensuite avec une fondamentale longue à gauche seulement si le premier chorus reste stable.","ear":"Entendre le premier Do et choisir avant chaque phrase si elle répond ou laisse du silence.","tim":"Transfert direct des blocs une note et respiration vers un morceau mémorisé.","validation":"Deux chorus différents sur playback, puis un chorus avec main gauche minimale sans perte de forme.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":23},{"kind":"bridge","id":"P18","number":18,"title":"Retour à R-3-5-3 avec motif puis variation","objective":"Réintroduire la basse la plus dense seulement après avoir construit plusieurs niveaux de repli.","work":"Main droite : Do–Mi♭–Fa au rythme noire–noire–blanche, mesures 1, 5 et 9. Main gauche R-3-5-3. Au deuxième chorus, modifier une seule note ou une seule durée. Protéger d’abord G → C par un silence.","ear":"Entendre la dernière note du motif et comparer modèle / variante.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Deux chorus continus sans perte de basse ; puis un troisième contenant trois variations contrôlées.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":24},{"kind":"bridge","id":"P19","number":19,"title":"Première paire de croches swing, puis main gauche minimale","objective":"Introduire les croches comme un événement ponctuel avant de les opposer à R-3-5-3.","work":"Étape A, playback seul : une paire de croches swing sur le temps 2, une fois toutes les deux mesures. Étape B : reprendre la cellule avec fondamentales en rondes, puis avec accords-coquilles au temps 1. Employer seulement Do et Mi bémol.","ear":"Vocaliser « long-court » puis entendre la première note de la paire avant de jouer.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Deux chorus à chaque étape, sans flot continu de croches ni raccourcissement de la main gauche.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":25},{"kind":"bridge","id":"P20","number":20,"title":"Croches ponctuelles au-dessus de R-3-5-3","objective":"Valider un premier niveau d’indépendance réelle tout en protégeant les points fragiles.","work":"Main gauche R-3-5-3. Main droite : paire de croches préparée aux mesures 1, 5 et 9. À l’approche de G → C, revenir à une noire, une blanche ou au silence. Après stabilité, ajouter une seule paire à un endroit choisi.","ear":"Entendre la première note de chaque paire et la dernière note de la grille.","tim":"Préparation personnalisée et transfert vers le répertoire.","validation":"Deux chorus stables avec G → C intact. En cas de perte, réussir deux fois avec le comping ou les fondamentales en rondes, puis revenir à R-3-5-3. Après validation, reprendre à la semaine 37.","phaseNumber":0,"phaseTitle":"Pont personnalisé","routeIndex":26},{"kind":"week","id":"S37","number":37,"title":"Beginner’s Blues par cellules","objective":"Apprendre la partie écrite en boucles d’une mesure, puis de deux ; mains séparées avant chaque assemblage.","work":"Avec la partition de Beginner's Blues, travailler chaque main séparément puis ensemble : une mesure, deux mesures, puis le bloc 1-4. Lorsque 1-4 est stable, appliquer exactement la même procédure à 5-8 puis 9-12. Marquer sur la partition les attaques communes et les attaques décalées ; en cas d'erreur, reprendre uniquement la cellule concernée.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : Beginner’s Blues.","validation":"Jouer les mesures 1-4 trois fois sans erreur, puis 5-8 trois fois, puis 9-12 trois fois. Terminer par une exécution continue des 12 mesures sans arrêt. La semaine est validée seulement lorsque les trois blocs et l'assemblage complet sont stables.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":27},{"kind":"week","id":"S38","number":38,"title":"Off-on rhythm hors clavier","objective":"Frapper la basse en noires sur la cuisse gauche et le rythme off-on sur la cuisse droite.","work":"Utiliser exactement la cellule off-on écrite dans l'exercice du chapitre 1 de Tim Richards retenu pour ce parcours ; ne pas en inventer une autre cette semaine. Étape A : frapper la basse en noires sur la cuisse gauche et cette cellule off-on sur la cuisse droite en vocalisant la subdivision « 1-et-2-et-3-et-4-et ». Étape B : après huit mesures corporelles correctes, jouer la cellule à la main droite seule sur une note ou l'accord indiqué par l'exercice, huit mesures. Main gauche silencieuse au clavier.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : exercice de coordination off-on.","validation":"Huit mesures corporelles consécutives sans déplacement de la pulsation, puis huit mesures à la main droite seule reproduisant exactement la cellule écrite. Réussir les deux étapes trois fois sur au moins deux jours.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":28},{"kind":"week","id":"S39","number":39,"title":"Off-on avec fondamentale seulement","objective":"Main gauche : une fondamentale au temps 1. Main droite : accords ou note unique en off-on.","work":"Utiliser la même cellule off-on exacte que S38. Main gauche : fondamentale de l'accord au temps 1, tenue quatre temps sur chaque mesure de la grille. Main droite : première étape sur une seule note Do avec la cellule off-on ; seconde étape seulement après stabilité, utiliser l'accord ou les notes indiqués dans l'exercice de Tim Richards sans changer le rythme. Travailler d'abord deux mesures de C7, puis quatre, puis la grille complète.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Adaptation de l’exercice du chapitre 1.","validation":"Une grille de 12 mesures avec fondamentales régulières et cellule off-on exactement placée, sans que le contretemps devienne un temps fort et sans raccourcir la main gauche. Réussir trois prises sur deux jours.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":29},{"kind":"week","id":"S40","number":40,"title":"Off-on avec R-3-5-3 en blocs","objective":"Assembler sur deux mesures de Do, puis quatre mesures, puis la grille.","work":"Main gauche : R-3-5-3. Main droite : reprendre strictement la cellule off-on de S38-S39, d'abord sur Do uniquement. Boucler deux mesures de C7 cinq fois ; puis quatre mesures cinq fois. Ajouter ensuite les changements de F7 et G7 par blocs de quatre mesures avant d'assembler la grille. Tempo 44-56 BPM ; aucune variation rythmique ou mélodique pendant ce bloc.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : rythme off-on appliqué.","validation":"Valider successivement un bloc de quatre mesures cinq fois sans erreur, puis deux blocs de quatre mesures. La validation complète est obtenue lorsqu'une grille de 12 mesures est jouée une fois sans arrêt ; si elle n'est pas encore disponible, conserver la semaine jusqu'à cette réussite plutôt que d'avancer sur une grille incomplète.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":30},{"kind":"week","id":"S41","number":41,"title":"Beginner’s Blues mélodique à droite seule","objective":"Apprendre la mélodie par groupes de deux mesures sur playback, en chantant d’abord le contour.","work":"Playback, main gauche silencieuse. Apprendre la mélodie de Beginner's Blues (Melodic) par cellules de deux mesures : écouter ou lire la cellule, chanter son contour, jouer deux fois, puis passer à la suivante. Assembler 1-4, 5-8 et 9-12 avant le thème complet. Revenir localement à la cellule qui change involontairement.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : Beginner’s Blues (Melodic).","validation":"Jouer la mélodie complète deux fois de suite avec playback, sans arrêt, avec rythme et syncopes conservés. La partition peut rester ouverte, mais aucune reprise depuis le début n'est autorisée après une erreur locale.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":31},{"kind":"week","id":"S42","number":42,"title":"Mélodie + basse par points d’ancrage","objective":"Assembler seulement les temps où les mains jouent ensemble ; ajouter ensuite les notes intermédiaires.","work":"Sur la partition de Beginner's Blues (Melodic), repérer d'abord dans chaque bloc de quatre mesures toutes les attaques où les deux mains jouent ensemble. Étape A : jouer uniquement ces points d'ancrage. Étape B : ajouter les notes intermédiaires de la main gauche tout en gardant la mélodie exacte. Travailler deux temps, une mesure, deux mesures, puis les blocs 1-4, 5-8 et 9-12. Ne jamais recommencer automatiquement au début du morceau.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Beginner’s Blues (Melodic), mains ensemble.","validation":"Chaque bloc de quatre mesures doit être réussi trois fois de suite mains ensemble. Puis jouer les 12 mesures deux fois sans arrêt avec la mélodie inchangée et la basse complète.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":32},{"kind":"week","id":"S43","number":43,"title":"Variation d’une note dans la mélodie","objective":"Jouer la mélodie écrite, puis remplacer une seule note par Do, Mi bémol ou Fa.","work":"Conserver exactement le rythme et la basse ; seule la hauteur change.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Premier passage sécurisé de l’interprétation à l’improvisation.","validation":"Faire quatre variations intentionnelles et pouvoir dire quelle note a été changée.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":33},{"kind":"week","id":"S44","number":44,"title":"Variation d’un rythme","objective":"Conserver les hauteurs d’un motif de la mélodie mais déplacer ou allonger une note.","work":"Choisir un motif de 2 à 4 notes de la mélodie écrite. Jouer d'abord le motif original. Rejouer les mêmes hauteurs en modifiant une seule variable rythmique : soit déplacer une attaque, soit allonger une note ; ne pas faire les deux. La basse reste strictement identique. Construire quatre couples original-variante répartis dans la grille.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Développement motivique élémentaire à partir du morceau.","validation":"Produire quatre couples original-variante où les hauteurs restent identiques et où une seule modification rythmique est présente. À la réécoute, identifier pour chaque couple la modification effectuée sans consulter la partition.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":34},{"kind":"week","id":"S45","number":45,"title":"Tierce bleue : tension puis résolution","objective":"À droite seule, travailler Mi bémol vers Mi naturel sur C, puis transposer le geste sur F et G.","work":"Playback, main gauche silencieuse au départ. Travailler séparément : sur C7, Mi bémol vers Mi ; sur F7, La bémol vers La ; sur G7, Si bémol vers Si. Pour chaque accord, jouer quatre fois la tension puis sa résolution, avec une noire sur la tierce bleue suivie d'une note tenue sur la tierce majeure. Ensuite placer au maximum une résolution b3-3 par phrase dans une grille, aux débuts des blocs I, IV et V.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : Blue Third Blues.","validation":"Six résolutions propres dans la grille, au moins une sur chacun des trois accords, sans frapper simultanément les deux tierces et sans terminer la phrase sur la tierce bleue.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":35},{"kind":"week","id":"S46","number":46,"title":"Beginner’s Boogie : basse seule","objective":"Extraire le motif de main gauche et le travailler sur Do uniquement, puis sur Fa et Sol séparément.","work":"Tempo très inférieur à celui de l’enregistrement ; priorité à la détente et au rebond.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : Beginner’s Boogie.","validation":"Huit mesures stables sur chaque accord ; aucune accélération obligatoire.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":36},{"kind":"week","id":"S47","number":47,"title":"Beginner’s Boogie avec riffs préparés","objective":"Ajouter un riff de deux notes à droite, identique toutes les deux mesures.","work":"Main gauche : motif de Beginner's Boogie déjà stabilisé en S46. Main droite : riff pédagogique fixe Do sur le temps 2 puis Mi bémol sur le temps 4, une fois toutes les deux mesures ; aucune autre note. Étape A : quatre mesures sur C7 ; étape B : bloc I-IV ; étape C : grille complète. Ne pas improviser pendant la validation.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Beginner’s Boogie, version pédagogique réduite.","validation":"Une grille lente complète avec le riff Do sur 2 / Mi bémol sur 4 exactement six fois, basse de boogie continue et aucune accélération. Réussir deux prises sur deux jours différents.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":37},{"kind":"week","id":"S48","number":48,"title":"Checkpoint : thème puis chorus","objective":"Jouer Beginner’s Blues ou la version mélodique, puis un chorus improvisé à trois ou cinq notes.","work":"Choisir Beginner's Blues ou Beginner's Blues (Melodic). Jouer le thème une fois, puis un chorus improvisé de 12 mesures avec 3 à 5 notes maximum. Choisir avant la prise un seul accompagnement : playback, fondamentale-quinte ou R-3-5-3. Dans le chorus, laisser au moins trois mesures entièrement silencieuses et répéter au moins un motif. Terminer volontairement sur Do dans les deux dernières mesures.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Fin du premier parcours utile du chapitre 1.","validation":"Une prise continue thème + chorus est réussie si cinq conditions sont remplies : aucune interruption ; forme intacte ; accompagnement stable ou playback suivi sans dérive ; au moins trois mesures silencieuses ; motif reconnaissable et conclusion volontaire. Obtenir deux prises réussies sur deux jours différents.","phaseNumber":4,"phaseTitle":"Entrer réellement dans le chapitre 1","routeIndex":38},{"kind":"week","id":"S49","number":49,"title":"Notes de triade comme cibles","objective":"Sur playback, improviser avec la pentatonique mais terminer les phrases sur Do, Mi ou Sol lorsque l’accord I revient.","work":"Playback ou accords-coquilles en rondes à la main gauche. Main droite : pentatonique de Do mineur. Avant chaque phrase, choisir comme note finale Do, Mi ou Sol lorsque l'accord C7 est présent. Dans chaque chorus, préparer quatre fins de phrase, par exemple aux mesures 2, 4, 8 et 12 ; laisser la cible sonner au moins un temps. Faire deux chorus, soit huit cibles prévues au total.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 1 : Five-Finger Blues et langage des triades.","validation":"Atteindre les huit notes finales choisies avant de jouer, sans les chercher au clavier et sans interrompre la pulsation. Au moins six des huit doivent tomber exactement à l'endroit prévu lors de trois essais sur deux jours.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":39},{"kind":"week","id":"S50","number":50,"title":"Cibler chaque changement d’accord","objective":"Préparer une note cible au premier temps : Do pour I, Fa pour IV, Sol pour V.","work":"Playback ou accords-coquilles très simples. Préparer six cibles par chorus : M1 Do sur C7, M5 Fa sur F7, M7 Do au retour de C7, M9 Sol sur G7, M10 Fa sur F7, M11 Do sur C7. Une note voisine peut précéder chaque cible, mais la cible doit tomber sur le temps 1 ; le reste de la phrase reste limité à 2-3 notes. Réaliser deux chorus, soit 12 cibles prévues.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Étape manquante entre gamme globale et jeu sur les accords.","validation":"Sur les 12 cibles prévues dans deux chorus, en atteindre au moins 9 exactement sur le temps 1 sans perte de forme ni arrêt.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":40},{"kind":"week","id":"S51","number":51,"title":"Tierce bleue de chaque accord","objective":"Travailler b3-3 sur C7, F7 et G7 séparément, puis seulement au début des blocs harmoniques.","work":"Main gauche : accord-coquille tenu. Main droite : travailler quatre fois chaque résolution séparément : C7 = Mi bémol-Mi ; F7 = La bémol-La ; G7 = Si bémol-Si. Puis dans la grille, placer une résolution au début du bloc C7, une au début du bloc F7 et une au début du bloc G7, avec au moins une mesure de silence entre deux utilisations si nécessaire.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Blue Third Blues, réinvesti dans la grille.","validation":"Dans trois chorus, produire à chaque fois une résolution correcte sur C7, F7 et G7, soit neuf résolutions au total, sans précipiter la résolution et sans rester sur la tierce bleue.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":41},{"kind":"week","id":"S52","number":52,"title":"Ajouter la sixte sans perdre le langage blues","objective":"Découvrir La comme couleur sur C et comparer pentatonique majeure et mineure.","work":"Playback seul au départ. Réservoir majeur : Do-Ré-Mi-Sol-La. Réservoir mineur : Do-Mi bémol-Fa-Sol-Si bémol. Construire un dialogue de quatre mesures : M1 petite phrase de 2-4 notes avec le réservoir majeur ; M2 silence ; M3 réponse de 2-4 notes avec le réservoir mineur ; M4 silence. Répéter ce schéma trois fois pour couvrir 12 mesures, en gardant le même rythme de base entre question et réponse lorsque c'est possible.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Transition vers le chapitre 2.","validation":"Un chorus contenant trois couples majeur-silence-mineur-silence. À la réécoute, identifier correctement les trois phrases majeures et les trois réponses mineures et conserver la forme sans interruption.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":42},{"kind":"week","id":"S53","number":53,"title":"Accords de sixte à droite seule","objective":"Former C6, F6 et G6 ; jouer position fondamentale puis l’inversion la plus proche.","work":"Main droite seule : C6 = Do-Mi-Sol-La ; F6 = Fa-La-Do-Ré ; G6 = Sol-Si-Ré-Mi. Jouer d'abord chaque accord en position fondamentale, puis choisir pour F6 et G6 l'inversion la plus proche de C6 afin de limiter les déplacements. Faire trois cycles C6-F6-C6-G6-F6-C6 en rondes. Main gauche silencieuse ; une fondamentale tenue peut être ajoutée seulement pour vérifier l'oreille après les trois cycles.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 2 : accords de sixte.","validation":"Trois cycles complets sans chercher les notes ni faire de saut inutile. Puis, sur cinq comparaisons triade / accord de sixte jouées dans un ordre aléatoire, identifier correctement au moins quatre fois la couleur avec sixte.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":43},{"kind":"week","id":"S54","number":54,"title":"Basse R-3-5-6","objective":"Main gauche seule : C-E-G-A, puis motifs équivalents sur F et G.","work":"Assembler la grille à 48-60 BPM avant toute intervention de la main droite.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 2 : ligne de basse R-3-5-6.","validation":"Deux grilles stables et détendues ; tempo inchangé si la transition reste hésitante.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":44},{"kind":"week","id":"S55","number":55,"title":"R-3-5-6 + phrase unique","objective":"Main droite : un motif de trois notes toutes les deux mesures, appris à l’avance.","work":"Main gauche : basse R-3-5-6 stabilisée en S54. Main droite : motif Do-Mi bémol-Fa au rythme noire-noire-blanche dans les mesures 1, 3, 5, 7, 9 et 11 ; mesures paires silencieuses. Faire un chorus avec R-3-5-3 puis un chorus avec R-3-5-6 sans changer le motif de droite ni le tempo.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Préparation à Sixth Blues.","validation":"Deux chorus complets avec le même motif de droite : un avec R-3-5-3 et un avec R-3-5-6. La basse choisie comme plus confortable doit ensuite permettre deux nouveaux chorus sans rupture.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":45},{"kind":"week","id":"S56","number":56,"title":"Sixth Blues par blocs","objective":"Apprendre le morceau écrit mains séparées et en blocs de deux mesures.","work":"Avec la partition de Sixth Blues, mains séparées d'abord. Travailler M1-2, M3-4, puis assembler M1-4 ; appliquer la même méthode à M5-8. Repérer et mémoriser un motif de main droite réutilisable. Les mesures 9-12 pourront être complétées lors d'une séance supplémentaire ou du retour ultérieur au morceau : cette semaine ne demande pas encore la maîtrise intégrale du morceau.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 2 : Sixth Blues.","validation":"Jouer au moins les mesures 1-8 en continuité deux fois, mains ensemble, sans arrêt, et rejouer de mémoire le motif de droite choisi trois fois.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":46},{"kind":"week","id":"S57","number":57,"title":"Call and response sur une mesure","objective":"Question d’une mesure, réponse d’une mesure, puis deux mesures de silence.","work":"Main gauche : accompagnement déjà maîtrisé, jamais un nouveau motif cette semaine.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Application aux encadrés d’improvisation du chapitre 2.","validation":"Trois dialogues distincts dans un chorus, sans remplissage des silences.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":47},{"kind":"week","id":"S58","number":58,"title":"Développer un motif sans le perdre","objective":"Séquence obligatoire : original, répétition, nouvelle fin, déplacement rythmique.","work":"Même registre et même tonalité ; aucune transposition du motif.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Complément pédagogique aux fragments d’arpège de Tim Richards.","validation":"Construire un chorus entier à partir d’un seul motif reconnaissable.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":48},{"kind":"week","id":"S59","number":59,"title":"Première transposition : Fa, version allégée","objective":"Sur playback en Fa, apprendre Fa-La bémol-Si bémol-Do-Mi bémol ; improviser d’abord avec trois notes.","work":"Main gauche : fondamentale en ronde seulement. Ne pas transposer simultanément la basse complexe.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Les morceaux en Fa du chapitre 2 deviennent accessibles progressivement.","validation":"Un chorus en Fa avec forme correcte et au moins deux silences de mesure entière.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":49},{"kind":"week","id":"S60","number":60,"title":"Checkpoint : trois chorus structurés","objective":"En Do : chorus 1 très peu de notes, chorus 2 motif développé, chorus 3 intensité légèrement accrue.","work":"En Do, garder le même accompagnement pendant trois chorus. Chorus 1 : phrases très courtes, maximum deux attaques par mesure et au moins trois mesures entières de silence. Chorus 2 : choisir un motif de 2-4 notes, le faire revenir au moins trois fois avec une seule variation à la fois. Chorus 3 : augmenter légèrement la densité jusqu'à quatre attaques maximum par mesure sur M1-8, puis réduire sur M9-12 et conclure sur Do. En Fa, faire ensuite un chorus simple avec Fa-La bémol-Si bémol seulement, playback ou fondamentales en rondes, avec au moins deux mesures entières de silence.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Sixth Blues ou un morceau préféré des chapitres 1-2.","validation":"Une prise de trois chorus en Do est réussie si chaque chorus respecte sa fonction, la forme reste intacte et aucun arrêt n'apparaît. Le chorus en Fa est validé s'il reste dans les trois notes prévues, conserve la forme et contient au moins deux mesures silencieuses. Obtenir l'ensemble deux fois sur deux jours différents.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":50},{"kind":"standard","id":"BG1","number":1,"title":"Bag’s Groove · passage 1 — Écouter le riff de Bag’s Groove dans la forme en Fa","objective":"Découvrir un deuxième standard sans réunir immédiatement nouvelle tonalité, nouvelle mélodie et nouvelle main gauche.","work":"Écouter une seule version de référence. Suivre les trois blocs de quatre mesures, distinguer le riff du thème et le début des solos, puis repérer les retours de Fa, Si♭ et Do.","ear":"Fredonner le rythme du riff ou seulement sa note finale. Marquer les mesures 1, 5 et 9 avec la main.","tim":"Application transversale des acquis de Sixth Blues et de la première transposition en Fa.","validation":"Suivre trois chorus sans perdre les repères 1–5–9 et reconnaître chaque retour du riff.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":51},{"kind":"standard","id":"BG2","number":2,"title":"Bag’s Groove · passage 1 — Apprendre le riff par cellules de deux mesures","objective":"Mémoriser un vocabulaire de riff en conservant son placement et ses silences.","work":"Frapper le rythme, jouer la cellule à droite seule, laisser la réponse du playback, puis recommencer. Travailler deux mesures, puis quatre ; aucune main gauche.","ear":"Comparer attaque, durée de la dernière note et espace qui suit le riff. La cellule doit pouvoir être entendue avant d’être jouée.","tim":"Bag’s Groove apporte un modèle de motif très court que l’on pourra ensuite développer.","validation":"Reproduire chaque cellule deux fois de suite et reconnaître immédiatement une version volontairement modifiée.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":52},{"kind":"standard","id":"BG3","number":3,"title":"Bag’s Groove · passage 1 — Mémoriser le thème complet de Bag’s Groove","objective":"Jouer le thème en Fa sans partition et sans dépendre du début du morceau.","work":"Assembler les cellules avec playback. Travailler séparément les départs des mesures 1, 5 et 9. Conserver une seule version de référence jusqu’à stabilisation.","ear":"Entendre le riff de la section suivante pendant la mesure qui précède ; enregistrer puis comparer.","tim":"Le thème est appris avant l’accompagnement afin que la tonalité de Fa reste la seule nouveauté.","validation":"Deux thèmes de mémoire et trois départs autonomes aux mesures 1, 5 et 9.","phaseNumber":5,"phaseTitle":"Développer un vocabulaire blues utilisable","routeIndex":53},{"kind":"week","id":"S61","number":61,"title":"Accords de septième dominante","objective":"Construire C7, F7, G7 et comparer triade, accord de sixte et accord de septième.","work":"Main droite seule : C7 = Do-Mi-Sol-Si bémol ; F7 = Fa-La-Do-Mi bémol ; G7 = Sol-Si-Ré-Fa. Jouer chaque accord quatre fois en ronde, puis trois cycles C7-F7-C7-G7-F7-C7. Étape suivante : ajouter à la main gauche la fondamentale correspondante en ronde pendant que la main droite joue l'accord une seule fois au temps 1.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 3 : introduction aux accords de septième.","validation":"Trois cycles complets sans chercher les notes, puis deux grilles avec fondamentale à gauche et accord à droite. Pour chaque accord, nommer correctement la septième mineure avant de jouer.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":54},{"kind":"week","id":"S62","number":62,"title":"Guide tones 3 et b7","objective":"Main gauche : Mi-Si bémol pour C7, La-Mi bémol pour F7, Si-Fa pour G7.","work":"Choisir les renversements les plus proches pour minimiser les déplacements.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Chapitre 3, simplifié en accords-coquilles sans fondamentale.","validation":"Enchaîner deux grilles en rondes avec mouvement minimal.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":55},{"kind":"week","id":"S63","number":63,"title":"Guide tones + une note rythmique","objective":"Main gauche : guide tones au premier temps. Main droite : Do unique avec rythmes variés.","work":"Main gauche : guide tones Mi-Si bémol sur C7, La-Mi bémol sur F7, Si-Fa sur G7, attaqués au temps 1 et tenus quatre temps. Main droite : Do uniquement. Faire des phrases de une ou deux attaques maximum, ne dépassant jamais deux mesures, et imposer au moins une mesure entière de silence dans chaque bloc de quatre mesures. Commencer par des attaques sur les temps 1 ou 3 ; ajouter ensuite une attaque sur 2 ou 4 seulement après un chorus stable.","ear":"Écouter, vocaliser le rythme ou la note d’arrivée, puis reproduire avant de varier.","tim":"Pont entre blues et comping jazz.","validation":"Deux chorus continus avec guide tones stables, au moins trois mesures entières de silence par chorus et aucune répétition involontaire de la main gauche provoquée par le rythme de droite.","phaseNumber":6,"phaseTitle":"Passer du blues au jazz-blues","routeIndex":56},{"kind":"week","id":"S64","number":64,"title":"Comping fixe et espaces","objective":"Main gauche : guide tones sur le temps 1 puis un second accord léger sur le « et » de 3.","work":"Main gauche : guide tones au temps 1 puis répétition légère du même voicing sur le « et » de 3, rythme identique pendant tout le chorus. Main droite : uniquement Do-Mi bémol-Fa, une seule phrase de 2-4 attaques dans chaque bloc de deux mesures ; l'autre mesure du bloc reste silencieuse à droite. Ne changer ni le rythme de comping ni le voicing de gauche hors des changements d'ac
